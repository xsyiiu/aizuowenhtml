<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>考研英语大作文 · 交互模板 v2.9.4</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --card2:#f1ede4; --line:#e3ddd1; --line2:#cdc4b5;
  --fg:#20242b; --dim:#5b6472; --dim2:#8b929d;
  --accent:#b25f16; --accent-bg:rgba(178,95,22,.10);
  --blue:#2c66c4; --blue-bg:rgba(44,102,196,.10);
  --ok:#1c8a5f; --danger:#c0392b;
  --fs:1; --radius:14px; --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 18% -12%,#fffdf7 0%,transparent 62%),var(--bg);
  color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:calc(15px * var(--fs));line-height:1.55;
  padding-bottom:90px; overflow-x:hidden;
}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 40px}
header.top{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(253,251,246,.92);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:8px 14px}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo{width:calc(34px * var(--fs));height:calc(34px * var(--fs));border-radius:10px;background:linear-gradient(145deg,#d4822a,#a9550f);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:calc(18px * var(--fs));flex:none;box-shadow:0 4px 14px rgba(150,80,20,.18)}
.brand h1{font-size:calc(15px * var(--fs));margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:calc(11px * var(--fs));color:var(--dim2)}
.ver{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-radius:99px;font-size:calc(10px * var(--fs));color:var(--accent);background:var(--accent-bg)}
.bar-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--fg);padding:7px 11px;border-radius:10px;font-size:calc(13px * var(--fs));
  transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:#f4efe6}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(145deg,#c4711f,#a75712);color:#fff;border:none;font-weight:700;box-shadow:0 3px 10px rgba(150,80,20,.18)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.row2{display:flex;gap:10px;align-items:flex-start;margin-top:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:1 1 420px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:99px;font-size:calc(12.5px * var(--fs));color:var(--dim);white-space:nowrap}
.chip.on{background:var(--accent-bg);border-color:rgba(178,95,22,.45);color:var(--accent);font-weight:600}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.sel{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:calc(12.5px * var(--fs));max-width:230px}
.sw{display:inline-flex;align-items:center;gap:5px;font-size:calc(12px * var(--fs));color:var(--dim);border:1px solid var(--line);
  padding:5px 9px;border-radius:99px;background:var(--card);user-select:none}
.sw input{accent-color:var(--accent);margin:0}
.sw.on{color:var(--fg);border-color:rgba(178,95,22,.45)}
.layout{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media(min-width:1000px){
  html[data-ui="auto"] .layout{grid-template-columns:300px minmax(0,1fr)}
  html[data-ui="auto"] .side{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}
}
html[data-ui="desktop"] .layout{grid-template-columns:minmax(220px,300px) minmax(0,1fr)}
html[data-ui="desktop"] .side{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}
html[data-ui="desktop"] .chips{flex-wrap:wrap;overflow:visible}
html[data-ui="mobile"] .wrap{max-width:560px}
html[data-ui="mobile"] .side{position:static;max-height:none;overflow:visible}
html[data-ui="mobile"] .en{font-size:calc(16px * var(--fs));line-height:1.7}
html[data-ui="mobile"] .pblock{padding:12px 12px 4px}
html[data-ui="mobile"] .bar{padding:8px 10px}
html[data-ui="mobile"] .btn{padding:6px 9px;font-size:calc(12.5px * var(--fs))}
html[data-ui="mobile"] .brand h1{font-size:calc(14px * var(--fs))}
html[data-ui="mobile"] .controls{width:100%}
html[data-ui="mobile"] .chips{flex:1 1 100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.side h3,.ptitle{font-size:calc(12px * var(--fs));letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin:0 0 10px}
.field{margin-bottom:9px}
.field label{display:block;font-size:calc(11.5px * var(--fs));color:var(--dim);margin-bottom:3px}
.field input,.field select{width:100%;background:#fffdfa;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:calc(13px * var(--fs))}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.field .hint{font-size:calc(10.5px * var(--fs));color:var(--dim2);margin-top:2px}
.side-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:#f7f3ea;border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:none;background:transparent;color:var(--dim);padding:5px 4px;border-radius:6px;font-size:calc(12px * var(--fs))}
.seg button.on{background:var(--card2);color:var(--fg);font-weight:600}
preview{display:block}
.pblock{background:linear-gradient(180deg,#ffffff,#fdfaf4);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(60,45,20,.04);padding:14px 14px 6px;margin-bottom:14px}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pnum{width:calc(24px * var(--fs));height:calc(24px * var(--fs));border-radius:8px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-size:calc(12px * var(--fs));font-weight:700;flex:none}
.phead h2{font-size:calc(14px * var(--fs));margin:0;font-weight:700}
.phead .tag{font-size:calc(10.5px * var(--fs));color:var(--dim2);border:1px solid var(--line);padding:1px 6px;border-radius:99px}
.phead .tools{margin-left:auto;display:flex;gap:6px}
.mini{border:1px solid var(--line);background:transparent;color:var(--dim);font-size:calc(11px * var(--fs));padding:3px 8px;border-radius:8px}
.mini:hover{color:var(--fg);border-color:var(--line2)}
.sent{border-top:1px dashed var(--line);padding:11px 0}
.sent:first-of-type{border-top:none}
.sent-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sent-label{font-size:calc(11.5px * var(--fs));color:var(--accent);font-weight:600;letter-spacing:.02em}
.sent-sel{flex:1 1 160px;min-width:120px;background:#fffdfa;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:calc(11.5px * var(--fs));color:var(--dim)}
.sent-sel:hover{color:var(--fg)}
.en{font-family:var(--serif);font-size:calc(17.5px * var(--fs));line-height:1.75;letter-spacing:.1px;color:#1c2128;word-break:break-word}
@media(max-width:600px){.en{font-size:calc(16px * var(--fs));line-height:1.7}}
.zh{font-size:calc(12.5px * var(--fs));line-height:1.7;color:var(--dim);margin-top:5px;padding-left:9px;border-left:2px solid var(--line2)}
.note{font-size:calc(11.5px * var(--fs));color:#8a5a12;background:rgba(178,95,22,.06);border:1px solid rgba(178,95,22,.18);
  border-radius:8px;padding:5px 8px;margin-top:6px;line-height:1.6}
.note b{color:var(--accent)}
.slot{display:inline;border:none;background:var(--accent-bg);color:var(--accent);border-radius:6px;padding:1px 5px;
  margin:0 1px;font:inherit;font-family:var(--serif);border-bottom:1px dashed rgba(178,95,22,.45);line-height:1.5;transition:.12s}
.slot:hover{background:rgba(178,95,22,.15)}
.slot.filled{background:var(--blue-bg);color:#1f4f9e;border-bottom-color:rgba(44,102,196,.45)}
.slot.filled:hover{background:rgba(44,102,196,.18)}
.slot.empty{color:#96661c;opacity:1}
.slot.flash{outline:2px solid var(--accent);outline-offset:1px}
.slotdemo{background:var(--blue-bg);color:#1f4f9e;border-bottom:1px dashed rgba(44,102,196,.45);border-radius:6px;padding:1px 5px}
.hintbar{font-size:calc(12px * var(--fs));color:var(--dim);background:rgba(44,102,196,.05);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;margin-top:12px;line-height:1.7}
.empty-hint{text-align:center;color:var(--dim2);font-size:calc(13px * var(--fs));padding:26px 10px}
/* 题目卡 */
#qPanel{display:none;margin-top:12px;background:#fffdf7;border:1px solid #e6d7ba;border-left:4px solid var(--accent);
  border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(120,90,40,.05)}
#qPanel.on{display:block}
.qhead{display:flex;align-items:center;gap:8px;font-size:calc(12.5px * var(--fs));font-weight:700;color:var(--accent)}
.qhead .qclose{margin-left:auto;border:none;background:transparent;color:var(--dim);font-size:calc(16px * var(--fs));
  line-height:1;padding:2px 7px;border-radius:6px;font-family:inherit}
.qhead .qclose:hover{background:rgba(0,0,0,.06);color:var(--fg)}
.qbody{margin-top:8px;font-size:calc(12.5px * var(--fs));line-height:1.75}
.qsrc{white-space:pre-wrap;background:#fff;border:1px solid #ece0c8;border-left:3px solid #c9a86a;border-radius:8px;
  padding:8px 10px;margin-bottom:8px;color:#22262d;line-height:1.8;font-size:calc(12.5px * var(--fs))}
.qnote{margin:0 0 8px;color:#7a5c22;background:rgba(178,95,22,.06);border-radius:8px;padding:6px 10px;
  font-size:calc(12px * var(--fs));line-height:1.7}
.qrow{display:flex;gap:10px;padding:2px 0}
.qk{color:var(--dim2);font-weight:600;white-space:nowrap;flex:0 0 auto}
.qv{flex:1 1 auto;color:var(--fg);word-break:break-word}
.qv.en{color:#1f4f9e}
.qfloat{border:1px solid rgba(178,95,22,.45);background:var(--accent-bg);color:var(--accent);border-radius:99px;
  padding:5px 12px;font-size:calc(12px * var(--fs));margin:0 0 8px;font-family:inherit;cursor:pointer;font-weight:600}
.qfloat:hover{background:rgba(178,95,22,.16)}
#float{position:fixed;z-index:350;display:none;flex-direction:column;background:#fffdf7;border:1px solid var(--line2);
  border-radius:12px;box-shadow:0 16px 40px rgba(40,30,10,.28);overflow:hidden}
#float.on{display:flex}
.fhead{display:flex;align-items:center;gap:2px;padding:6px 8px;background:#f3ece0;border-bottom:1px solid var(--line);
  font-size:12px;color:var(--dim);cursor:move;touch-action:none;flex:0 0 auto;user-select:none}
.fhead .ftitle{margin-right:auto;font-weight:700;color:var(--fg);font-size:12px}
.fhead button{border:none;background:transparent;color:var(--dim);font-size:12px;padding:3px 7px;border-radius:6px;
  font-family:inherit;cursor:pointer}
.fhead button:hover{background:rgba(0,0,0,.07);color:var(--fg)}
.fbody{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px;background:#fff}
.fbody .fimg{display:block;width:100%;height:auto;border-radius:4px;margin-bottom:6px;cursor:zoom-in}
.fresize{position:absolute;right:0;bottom:0;width:46px;height:46px;cursor:nwse-resize;touch-action:none}
.fresize:after{content:"";position:absolute;right:5px;bottom:5px;width:18px;height:18px;border-radius:0 0 8px 0;
  background:linear-gradient(135deg,transparent 50%,rgba(150,120,70,.55) 50%)}
.qimgs{margin:0 0 8px}
.qimgwrap{display:block;margin:0 0 8px;border:1px solid #ece0c8;border-radius:8px;overflow:hidden;background:#fff;cursor:zoom-in}
.qimg{display:block;width:100%;height:auto}
.qtoggle{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:99px;
  padding:3px 10px;font-size:calc(11.5px * var(--fs));margin:0 0 8px;font-family:inherit;cursor:pointer}
.qtoggle:hover{color:var(--fg);border-color:var(--line2)}
#qv{position:fixed;inset:0;z-index:400;background:rgba(20,18,14,.95);display:none;overflow:auto;padding:10px}
#qv.on{display:block}
#qv img{display:block;margin:0 auto;border-radius:6px;max-width:none}
#qv .qvhint{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:#e6ddcb;font-size:12px;opacity:.8}
.qfoot{margin-top:8px;padding-top:7px;border-top:1px dashed #e6d7ba;font-size:calc(11px * var(--fs));color:var(--dim2);line-height:1.65}
@media (max-width:600px){
  .qrow{display:block}
  .qk{margin-top:5px}
}
/* modal */
#modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(48,42,32,.42);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.sheet{width:100%;max-width:720px;max-height:86vh;background:#fffdfa;border:1px solid var(--line2);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(60,45,20,.18);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:760px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-head h4{margin:0;font-size:calc(14px * var(--fs))}
.sheet-head .sub{font-size:calc(11px * var(--fs));color:var(--dim2);margin-left:auto}
.sheet-body{overflow:auto;padding:10px 12px 4px;flex:1}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:10px;
  padding:8px 10px;margin-bottom:7px;transition:.12s}
.opt:hover{border-color:var(--line2);background:#f6f1e8}
.opt.cur{border-color:var(--accent);background:var(--accent-bg)}
.opt .oe{font-family:var(--serif);font-size:calc(14.5px * var(--fs));color:#1f2328;line-height:1.5}
.opt .oz{font-size:calc(11.5px * var(--fs));color:var(--dim);margin-top:2px}
.opt .onote{font-size:calc(10.5px * var(--fs));color:#8a5a12;margin-top:2px}
.sheet-foot{padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sheet-foot input[type=text]{flex:1 1 180px;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.sheet-foot input[type=text]:focus{outline:none;border-color:var(--accent)}
.numtoggle{display:flex;gap:2px;background:#f7f3ea;border:1px solid var(--line);border-radius:9px;padding:2px}
.numtoggle button{border:none;background:transparent;color:var(--dim2);padding:5px 8px;border-radius:6px;font-size:calc(11px * var(--fs))}
.numtoggle button.on{background:var(--card2);color:var(--fg)}
#snapPanel{position:fixed;right:12px;top:112px;z-index:150;width:min(360px,calc(100vw - 24px));background:#fffdfa;
  border:1px solid var(--line2);border-radius:14px;padding:10px;display:none;box-shadow:0 14px 40px rgba(60,45,20,.16)}
#snapPanel.on{display:block}
.snap{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 8px;margin-bottom:6px;font-size:calc(11.5px * var(--fs))}
.snap b{font-size:calc(12px * var(--fs))}
.snap button{margin-left:auto}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:300;opacity:0;transition:.22s;
  background:#2b3038;color:#fff;padding:9px 16px;border-radius:99px;font-size:calc(13px * var(--fs));font-weight:600;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#updateBar{display:none;background:linear-gradient(90deg,#fff3d4,#ffe9bd);border-bottom:1px solid #e6c98d;color:#7a4a06;
  font-size:calc(12.5px * var(--fs));padding:7px 14px;text-align:center}
#updateBar.on{display:block}
#updateBar b{color:#8a5209}
.foot{margin-top:18px;color:var(--dim2);font-size:calc(11px * var(--fs));line-height:1.8;text-align:center}
.foot a{color:var(--dim)}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:calc(11px * var(--fs));color:var(--dim2);margin-top:8px}
.stats b{color:var(--accent);font-weight:700}
.fontctl{display:inline-flex;align-items:center;gap:1px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);padding:2px 4px}
.fontctl button{border:none;background:transparent;color:var(--dim);font-size:calc(12px * var(--fs));padding:3px 7px;border-radius:99px;font-weight:700}
.fontctl button:hover{background:var(--card2);color:var(--fg)}
.fontctl span{font-size:calc(11px * var(--fs));color:var(--dim2);min-width:36px;text-align:center;cursor:pointer;user-select:none}
.warn{color:#9a5a00;font-size:calc(11px * var(--fs));margin-top:6px;display:none}
.warn.on{display:block}
/* ===== 头部小按钮 ===== */
.hdr-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hbtn{position:relative;border:1px solid var(--line);background:#fffdfa;color:var(--dim);border-radius:99px;
  padding:3px 10px;font-size:calc(11.5px * var(--fs));font-family:inherit;cursor:pointer;white-space:nowrap}
.hbtn:hover{color:var(--fg);border-color:var(--line2)}
.hbtn .rdot{display:none;position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;
  background:#e0432c;box-shadow:0 0 0 2px #fff}
.hbtn .rdot.on{display:block}
/* ===== 星标 ===== */
.star-btn{border:none;background:transparent;color:#c9c2b4;font-size:calc(15px * var(--fs));line-height:1;
  padding:2px 5px;cursor:pointer;font-family:inherit;border-radius:6px;flex:0 0 auto}
.star-btn.on{color:#d99a00}
.star-btn:hover{background:rgba(0,0,0,.05)}
/* ===== 抽屉 / 弹窗 ===== */
.sys-mask{position:fixed;inset:0;z-index:500;background:rgba(40,34,26,.35);display:none}
.sys-mask.on{display:block}
.sys-drawer{position:fixed;z-index:501;top:0;right:0;bottom:0;width:min(400px,92vw);background:#fffdf8;border-left:1px solid var(--line2);
  transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(60,45,20,.16)}
.sys-drawer.on{transform:none}
.sys-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sys-head b{font-size:calc(14px * var(--fs))}
.sys-head button{margin-left:auto;border:none;background:transparent;font-size:calc(18px * var(--fs));color:var(--dim);cursor:pointer;padding:0 6px;font-family:inherit}
.sys-body{flex:1 1 auto;overflow:auto;padding:4px 14px 40px}
.sys-body h4{margin:16px 0 6px;font-size:calc(11.5px * var(--fs));letter-spacing:.08em;color:var(--dim2)}
.sys-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.sys-row .lbl{flex:1 1 auto;font-size:calc(13px * var(--fs));color:var(--fg)}
.sys-row .sub{display:block;color:var(--dim2);font-size:calc(11px * var(--fs));margin-top:2px;line-height:1.5}
.sys-seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}
.sys-seg button{border:none;background:transparent;padding:4px 9px;font-size:calc(11.5px * var(--fs));color:var(--dim);font-family:inherit;cursor:pointer}
.sys-seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:700}

function cloneReasons(suffix, connTag){
  return REASONS.map(function(v){
    var en=v.en, zh=v.zh;
    if(connTag && en.indexOf("For instance, ") === 0){ en = en.slice(14); zh = zh.replace(/^例如，/, ""); }
    RENAME.forEach(function(k){
      en = en.split("{"+k+"}").join("{"+k+suffix+"}");
      zh = zh.split("{"+k+"}").join("{"+k+suffix+"}");
    });
    if(connTag){ en = "{"+connTag+"} " + en; zh = "{"+connTag+"} " + zh; }
    return {n:v.n, en:en, zh:zh, note:v.note};
  });
}

function getSlot(id){

  var arr = slotOpts(id);
  for(var i=0;i<arr.length;i++){ if(arr[i].en === en) return arr[i]; }
  for(var k in BANK){
    var a = BANK[k].opts;
    for(var j=0;j<a.length;j++){ if(a[j].en === en) return a[j]; }
  }
  return null;
}
function setSlot(id, v, zh, num){
  if(!v){ delete state.slots[id]; return; }
  var o = findOpt(id, v);
  state.slots[id] = {v:v, zh:(zh|| (o && o.zh) || zhFor(id,v)), num:(num || (o && o.num) || "")};

  }
  return style.c[idx-1] || "";
}
function expand(raw, mode, depth){
  if(depth > 4) return raw;
  return String(raw).replace(/\{([A-Za-z0-9_]+)\}/g, function(m, key){
    return slotText(key, mode, depth+1);
  });
}
function slotText(id, mode, depth){
  if(AUTO[id]) return autoText(id, mode);
  var st = getSlot(id);
  if(!st) return "【" + slotLabel(id) + "】";
  var raw = (mode === "zh") ? (st.zh || st.v) : st.v;
  if(raw.indexOf("{") >= 0 && (depth||0) < 4){

    return sub.map(function(x){ return x.s; }).join("").replace(/\s+/g, " ");

function toPluralVerb(v){
  var low = v.toLowerCase();
  if(VERB_PAIRS[low]) return matchCase(v, VERB_PAIRS[low]);
  return v;
}
function toSingularVerb(v){
  var low = v.toLowerCase();
  if(PLURAL_TO_SG[low]) return matchCase(v, PLURAL_TO_SG[low]);
  if(BASE_TO_SG[low]) return matchCase(v, BASE_TO_SG[low]);
  return v;
}
function matchCase(src, out){
  if(src[0] === src[0].toUpperCase()) return out.charAt(0).toUpperCase() + out.slice(1);

}

function applyAgreement(segs){
  for(var i=0;i<segs.length-1;i++){
    var a = segs[i], b = segs[i+1];
    if(a.t === "slot" && b.t === "text"){
      var m = b.s.match(/^(\s+)([A-Za-z]+)/);
      var prevText = (i > 0 && segs[i-1].t === "text") ? segs[i-1].s : "";
      var afterAux = /\b(does|do|did|is|are|was|were|has|have|had|can|could|will|would|should|may|might|must)\s+$/i.test(prevText);
      if(m && a.filled && !afterAux){
        var verb = m[2];
        var num = a.num;
        if(!num){
          var st = getSlot(a.id);
          num = st && st.num;
        }
        if(num === "pl"){
          var pv = toPluralVerb(verb);
          if(pv !== verb) b.s = m[1] + pv + b.s.slice(m[0].length);
        }else if(num === "sg"){
          var sv = toSingularVerb(verb);
          if(sv !== verb) b.s = m[1] + sv + b.s.slice(m[0].length);
        }
      }
    }
    if(a.t === "slot" && b.t === "text" && /^\s+$/.test(b.s) && segs[i+2] && segs[i+2].t === "slot" && segs[i+2].filled && a.filled){
      var numN = a.num || (getSlot(a.id) && getSlot(a.id).num);
      var pre = (i > 0 && segs[i-1].t === "text") ? segs[i-1].s : "";
      var auxBefore = /\b(does|do|did|is|are|was|were|has|have|had|can|could|will|would|should|may|might|must)\s*$/i.test(pre);
      var vm = segs[i+2].s.match(/^([A-Za-z]+)/);
      if(vm && !auxBefore){
        var v2 = vm[1], nv = v2;
        if(numN === "pl") nv = toPluralVerb(v2);
        else if(numN === "sg") nv = toSingularVerb(v2);
        if(nv !== v2) segs[i+2].s = nv + segs[i+2].s.slice(v2.length);
      }
    }
    if(a.t === "text" && b.t === "slot" && b.filled){
      var tail = a.s.match(/\b(does|is|has|was)\s+$/);
      var num2 = b.num || (getSlot(b.id) && getSlot(b.id).num);
      if(tail && num2 === "pl"){

    }
  }
}

    }
    var s = seg.s, out = "";
    for(var j=0;j<s.length;j++){
      var ch = s[j];
      if(cap && /[A-Za-z]/.test(ch)){ out += ch.toUpperCase(); cap = false; continue; }
      out += ch;
      if(/[.!?]/.test(ch)){
        var nx = s[j+1];
        if(nx === undefined || nx === " " || nx === "\n"){ cap = true; }
        if(nx !== undefined && /[0-9]/.test(nx)) cap = false;
      } else if(ch === ":" && (s[j+1] === " " || s[j+1] === undefined)){
        cap = true;
      }
    }
    seg.s = out;
  }
}
function applyCommaLower(segs){
  for(var i=0;i<segs.length;i++){
    if(segs[i].t !== "text") continue;
    segs[i].s = segs[i].s.replace(/,\s+([A-Z])([a-z]+)/g, function(m, a, rest){
      var w = (a + rest).toLowerCase();
      return LOWER_AFTER_COMMA[w] ? (", " + w) : m;
    });
    if(!/,\s*$/.test(segs[i].s)) continue;
    var j = i+1;
    while(j < segs.length && segs[j].t === "text" && /^\s*$/.test(segs[j].s)) j++;
    if(j >= segs.length) continue;
    var seg = segs[j];
    if(seg.t === "slot" && seg.filled){
      seg.s = seg.s.replace(/^([A-Z])([a-z]+)/, function(m, a, rest){
        var w = (a + rest).toLowerCase();
        return LOWER_AFTER_COMMA[w] ? w : m;
      });
    }else if(seg.t === "text"){
      seg.s = seg.s.replace(/^(\s*)([A-Z])([a-z]+)/, function(m, sp, a, rest){
        var w = (a + rest).toLowerCase();
        return LOWER_AFTER_COMMA[w] ? (sp + w) : m;
      });
    }
  }
}

/* 中文自然拼：去掉英文句前的连接词空格 */
function segmentsOf(tpl, mode, opts){
  opts = opts || {};
  var depth = opts.depth || 0;
  var out = [], parts = String(tpl).split(/(\{[A-Za-z0-9_]+\})/);
  for(var i=0;i<parts.length;i++){
    var part = parts[i];
    if(!part) continue;
    var m = part.match(/^\{([A-Za-z0-9_]+)\}$/);
    if(m){
      var id = m[1];
      if(AUTO[id]){ var at = autoText(id, mode); if(at) out.push({t:"text", s:at}); continue; }
      var st = getSlot(id);
      var txt = st ? slotText(id, mode, depth) : "【" + slotLabel(id) + "】";
      out.push({t:"slot", id:id, s:txt, filled:!!st, num:(st && st.num) || ""});
    }else{
      out.push({t:"text", s:part});
    }
  }
  if(state.toggles.gram){
    applyAgreement(out);
    if(!opts.nested) applyCaps(out);
    applyCommaLower(out);
  }
  // 中文行：去掉中文标点周围的空格
  if(mode === "zh"){
    for(var z=0;z<out.length;z++){
      out[z].s = out[z].s.replace(/\s+([，。；：、！？])/g, "$1").replace(/([，。；：、！？])\s+/g, "$1");
    }
    for(var z2=1;z2<out.length-1;z2++){
      if(out[z2].t === "text" && /^\s+$/.test(out[z2].s)){
        var pv = out[z2-1].s, nx = out[z2+1].s;
        if(/[，。；：、！？]$/.test(pv) || /^[，。；：、！？]/.test(nx)) out[z2].s = "";
      }
    }
  }
  // 清理空槽位带来的多余标点/空格
  for(var k=0;k<out.length;k++){
    if(out[k].t === "text"){
      out[k].s = out[k].s.replace(/,\s*,/g, ",").replace(/\(\s*\)/g, "").replace(/\s{2,}/g, " ");
    }
  }
  return out;
}

function plainOf(segs){
  var s = "";
  segs.forEach(function(x){ s += x.s; });
  return s.replace(/\s+/g, " ").replace(/\s+([,.!?:;])/g, "$1").trim();
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

var FLOAT_KEY = "xrz-float-v1";
function floatSaved(){
  try{ var o = JSON.parse(localStorage.getItem(FLOAT_KEY)); return (o && typeof o === "object") ? o : null; }catch(e){ return null; }
}
function saveFloat(){
  var f = document.getElementById("float");
  if(!f || !f.classList.contains("on")) return;
  try{
    localStorage.setItem(FLOAT_KEY, JSON.stringify({
      l:f.offsetLeft, t:f.offsetTop, w:f.offsetWidth, h:f.offsetHeight
    }));
  }catch(e){}
}
function openFloat(srcs){
  if(!srcs || !srcs.length) return;
  var f = document.getElementById("float"), body = document.getElementById("fbody");
  body.innerHTML = srcs.map(function(s){
    return '<img class="fimg" src="' + s + '" alt="题目原图">';
  }).join("");
  Array.prototype.forEach.call(body.querySelectorAll(".fimg"), function(img){
    img.onclick = function(){ openQView(img.getAttribute("src")); };
  });
  f.classList.add("on");
  var vw = window.innerWidth, vh = window.innerHeight, st = floatSaved();
  var w = st && st.w ? st.w : Math.min(vw * 0.86, 380);
  var h = st && st.h ? st.h : Math.min(vh * 0.48, 450);
  w = Math.max(180, Math.min(w, vw - 8));
  h = Math.max(110, Math.min(h, vh - 8));
  var l = st && typeof st.l === "number" ? st.l : Math.round(vw - w - 8);
  var t = st && typeof st.t === "number" ? st.t : 96;
  l = Math.max(2, Math.min(l, vw - w - 2));
  t = Math.max(2, Math.min(t, vh - h - 2));
  f.style.left = l + "px"; f.style.top = t + "px";
  f.style.width = w + "px"; f.style.height = h + "px";
}
function closeFloat(){
  var f = document.getElementById("float");
  if(!f) return;
  saveFloat();
  f.classList.remove("on");
}
(function bindFloatWindow(){
  var f = document.getElementById("float");
  if(!f){
    if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", bindFloatWindow);
    else setTimeout(bindFloatWindow, 0);
    return;
  }
  var head = document.getElementById("fhead"), rs = document.getElementById("fresize");
  var drag = null;
  function P(e){ return e.touches ? e.touches[0] : e; }
  head.addEventListener("pointerdown", function(e){
    if(e.target && e.target.tagName === "BUTTON") return;
    drag = {mode:"move", x:P(e).clientX, y:P(e).clientY, l:f.offsetLeft, t:f.offsetTop};
    if(head.setPointerCapture){ try{ head.setPointerCapture(e.pointerId); }catch(err){} }
    e.preventDefault();
  });
  rs.addEventListener("pointerdown", function(e){
    drag = {mode:"resize", x:P(e).clientX, y:P(e).clientY, w:f.offsetWidth, h:f.offsetHeight};
    if(rs.setPointerCapture){ try{ rs.setPointerCapture(e.pointerId); }catch(err){} }
    e.preventDefault();
  });
  window.addEventListener("pointermove", function(e){
    if(!drag) return;
    var dx = P(e).clientX - drag.x, dy = P(e).clientY - drag.y;
    if(drag.mode === "resize"){
      f.style.width = Math.max(180, Math.min(drag.w + dx, window.innerWidth - 8)) + "px";
      f.style.height = Math.max(110, Math.min(drag.h + dy, window.innerHeight - 8)) + "px";
    }else{
      f.style.left = Math.max(2, Math.min(drag.l + dx, window.innerWidth - f.offsetWidth - 2)) + "px";
      f.style.top = Math.max(2, Math.min(drag.t + dy, window.innerHeight - f.offsetHeight - 2)) + "px";
    }
    e.preventDefault();
  }, {passive:false});
  window.addEventListener("pointerup", function(){ if(drag){ drag = null; saveFloat(); } });
  window.addEventListener("pointercancel", function(){ if(drag){ drag = null; saveFloat(); } });
  head.addEventListener("click", function(e){
    var b = e.target && e.target.closest ? e.target.closest("button") : null;
    if(!b) return;
    var act = b.getAttribute("data-act");
    if(act === "close"){ closeFloat(); return; }
    if(act === "minus" || act === "plus"){
      var k = act === "plus" ? 1.18 : 1 / 1.18;
      f.style.width = Math.max(180, Math.min(f.offsetWidth * k, window.innerWidth - 8)) + "px";
      f.style.height = Math.max(110, Math.min(f.offsetHeight * k, window.innerHeight - 8)) + "px";
      saveFloat();
      return;
    }
    if(act === "full"){
      var img = f.querySelector(".fimg");
      if(img) openQView(img.getAttribute("src"));
    }
  });
})();

function qv(v){ return (v === undefined || v === null || v === "") ? "" : String(v); }
function briefData(s){

/* ============ 版本 / 更新 ============ */
function compareVer(a, b){
  var x = a.split(".").map(Number), y = b.split(".").map(Number);
  for(var i=0;i<3;i++){ if((x[i]||0) !== (y[i]||0)) return (x[i]||0) - (y[i]||0); }
  return 0;
}
function repoInfo(){
  var h = location.hostname || "";
  if(!/github\.io$/.test(h)) return null;
  var owner = h.split(".")[0];
  var parts = (location.pathname || "/").split("/").filter(Boolean);
  if(!parts.length) return null;
  var repo = parts[0];
  var rest = parts.slice(1).join("/") || "index.html";
  return {owner:owner, repo:repo, path:rest, branch:"main"};
}
function checkUpdateLegacy(silent){
  if(typeof fetch !== "function"){ if(!silent) toast("当前浏览器不支持自动检查更新"); return; }
  var info = repoInfo();
  if(!info){ if(!silent) toast("本地打开，跳过在线检查"); return; }
  var url = "https://raw.githubusercontent.com/" + info.owner + "/" + info.repo + "/" + info.branch + "/" + info.path + "?t=" + Date.now();
  fetch(url, {cache:"no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
    var m = txt.match(/APP_VERSION\s*=\s*'([0-9.]+)'/);
    if(m && compareVer(m[1], APP_VERSION) > 0){
      document.getElementById("newVer").textContent = "v" + m[1] + "（当前 v" + APP_VERSION + "）";
      document.getElementById("updateBar").classList.add("on");
    } else if(!silent){ toast("已是最新版本 v" + APP_VERSION); }
  }).catch(function(){ if(!silent) toast("检查更新失败（网络）"); });
}
function forceReload(){
  var u = location.pathname + "?v=" + Date.now();
  location.replace(u);
}

var FS_KEY = "xrz-font-scale";

}
function stepFS(d){

function vHash(s){ var h = 5381, i; s = String(s || ""); for(i = 0; i < s.length; i++){ h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; } return h.toString(36); }

/* ---- 导出 / 导入 ---- */
function sysExport(){
  try{
    var data = {app:"xrz-essay", page:SYS_PAGE, ver:APP_VERSION, at:new Date().toISOString(), state:state, stars:stars, settings:sysSet};
    var blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "考研英语作文备份-" + (SYS_PAGE === "big" ? "大作文" : "小作文") + "-v" + APP_VERSION + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast("已导出备份文件");
  }catch(e){ toast("导出失败"); }
}
function sysImport(file){
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(fr.result);
      if(d.stars && typeof d.stars === "object"){ stars = d.stars; sysStore(STAR_KEY, stars); }
      if(d.settings){ sysSet.autoFloat = d.settings.autoFloat !== false; sysSet.alpha = d.settings.alpha || 1; sysSaveSet(); }
      if(d.state && d.state.type){
        state = d.state;
        persist(); renderAll();
      }
      decorateStars(); renderStarList(); refreshSysUI(); applyFloatAlpha();
      toast("已导入");
    }catch(e){ toast("导入失败：文件不是本工具的备份"); }
  };
  fr.readAsText(file);
}

/* ---- 检查更新 ---- */
function markUpdateDot(on){
  var d = document.getElementById("updDot");
  if(d) d.classList.toggle("on", !!on);

function remoteNotes(v, cb){
  var info = (typeof repoInfo === "function") ? repoInfo() : null;
  if(!info || typeof fetch !== "function"){ cb(null); return; }
  var url = "https://raw.githubusercontent.com/" + info.owner + "/" + info.repo + "/" + info.branch + "/changelog.json?t=" + Date.now();
  fetch(url, {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if(!j){ cb(null); return; }
    var arr = j[SYS_PAGE] || [];
    for(var i = 0; i < arr.length; i++){ if(arr[i] && arr[i].v === v){ cb(arr[i].items || null); return; } }
    cb(null);
  }).catch(function(){ cb(null); });
}
function openUpdateDialog(v){
  if(!v) return;
  var body = document.getElementById("updBody");
  var t = document.getElementById("updTitle");
  if(t) t.textContent = "发现新版本 v" + v;
  if(body){
    var pre = (updInfo.notes && updInfo.found === v) ? updInfo.notes : logNotes(v);
    body.innerHTML = '<div class="log-d">当前版本 v' + APP_VERSION + '，可更新到 v' + v + '。更新会重新加载页面，本机草稿不会丢。</div>' +
      '<ul class="log-li" id="updNotes">' + pre.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
    if(!(updInfo.notes && updInfo.found === v)) remoteNotes(v, function(items){
      var box = document.getElementById("updNotes");
      if(items && items.length && box){
        box.innerHTML = items.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("");
      }
    });
  }
  document.getElementById("updModal").classList.add("on");
}
function sysCheck(silent){
  var info = (typeof repoInfo === "function") ? repoInfo() : null;
  if(!info){ if(!silent) toast("本地打开，跳过在线检查"); return; }
  if(typeof fetch !== "function"){ if(!silent) toast("当前浏览器不支持自动检查更新"); return; }
  var url = "https://raw.githubusercontent.com/" + info.owner + "/" + info.repo + "/" + info.branch + "/" + info.path + "?t=" + Date.now();
  fetch(url, {cache:"no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
    var m = txt.match(/APP_VERSION\s*=\s*'([0-9.]+)'/);
    if(!m){ if(!silent) toast("检查失败：没有读到版本号"); return; }
    var v = m[1];
    /* 新版本的更新说明直接从这个远端文件里取，避免再多请求一次 changelog.json */
    try{
      var cm = txt.match(/var CHANGELOG = (\[[\s\S]*?\]);\s*/);
      if(cm){
        var arr = JSON.parse(cm[1]);
        for(var ci = 0; ci < arr.length; ci++){
          if(arr[ci] && arr[ci].v === v){ updInfo.notes = arr[ci].items || null; break; }
        }
      }
    }catch(e){}
    if(compareVer(v, APP_VERSION) > 0){
      updInfo.found = v;
      try{ localStorage.setItem("xrz-upd-found-v1", JSON.stringify(v)); }catch(e){}
      var ignored = (updInfo.ignored === v);
      markUpdateDot(!ignored);
      if(silent){
        if(!ignored && !sessionStorage.getItem("xrz-upd-pop-" + v)){
          sessionStorage.setItem("xrz-upd-pop-" + v, "1");
          openUpdateDialog(v);
        }
      } else {
        openUpdateDialog(v);
      }
    } else {
      updInfo.found = "";
      try{ localStorage.removeItem("xrz-upd-found-v1"); }catch(e){}
      markUpdateDot(false);
      if(!silent) toast("已是最新版本 v" + APP_VERSION);
    }
  }).catch(function(){ if(!silent) toast("检查更新失败（网络不通）"); });
}
function onCheckBtn(){
  if(updInfo.found){ openUpdateDialog(updInfo.found); return; }
  sysCheck(false);
}

/* ---- 持久化存储 ---- */
function sysStorageInfo(){
  var out = {persist:null, usage:"", text:""};
  if(!navigator.storage || !navigator.storage.persisted) return out;
  return navigator.storage.persisted().then(function(ok){
    out.persist = ok;
    if(navigator.storage.estimate){
      return navigator.storage.estimate().then(function(e){
        if(e && e.usage){ out.usage = (e.usage / 1048576).toFixed(1) + " MB"; }
        out.text = ok ? "已持久化" : "未持久化";
        return out;
      });
    }
    out.text = ok ? "已持久化" : "未持久化";
    return out;
  }).catch(function(){ return out; });
}
function sysAskPersist(){
  if(!navigator.storage || !navigator.storage.persist){ toast("这个浏览器不支持持久化存储"); return; }

function toggleFold(){
  var h = document.querySelector("header.top");
  var now = h.classList.contains("fold");
  applyFold(!now);
}

/* ---- 建议栏 ---- */
function boardReadLocal(){
  try{ var a = JSON.parse(localStorage.getItem(BOARD_KEY) || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
}
function boardWriteLocal(arr){
  try{ localStorage.setItem(BOARD_KEY, JSON.stringify(arr.slice(0, 100))); }catch(e){}
}
function boardHeaders(extra){
  var h = extra || {};
  h["Accept"] = "application/vnd.github+json";
  h["X-GitHub-Api-Version"] = "2022-11-28";
  if(BOARD_CFG.token && BOARD_CFG.token.indexOf("__") !== 0) h["Authorization"] = "Bearer " + BOARD_CFG.token;
  return h;
}
function ghApi(path, opt){
  var url = "https://api.github.com" + path;
  return fetch(url, opt).then(function(r){
    if(!r.ok) return r.text().then(function(t){
      var msg = "HTTP " + r.status;
      try{ var j = JSON.parse(t); if(j && j.message) msg += " " + j.message; }catch(e){}
      throw new Error(msg);
    });
    return r.json();
  });
}
function boardErr(msg){
  var st = document.getElementById("boardState");
  if(st){ st.textContent = "连不上共享存储：" + msg + "（先显示本机记录）"; st.style.color = "#b3261e"; }
}
function boardLoad(cb){
  if(BOARD_MODE === "github"){
    if(typeof fetch !== "function"){ boardErr("浏览器不支持 fetch"); boardCache = boardReadLocal(); cb(boardCache, false); return; }
    var path = "/repos/" + BOARD_CFG.owner + "/" + BOARD_CFG.repo + "/issues?state=open&sort=created&direction=desc&per_page=60";
    ghApi(path, {headers:boardHeaders()}).then(function(arr){
      var list = [];
      (arr || []).forEach(function(it){
        var t = it.title || "";
        if(t.indexOf("建议｜") !== 0) return;
        var raw = it.body || "";
        var owner = raw.indexOf(BOARD_OWNER_MARK) >= 0;
        list.push({
          name: owner ? BOARD_OWNER_NAME : (t.slice(3) || "匿名"),
          text: raw.split(BOARD_OWNER_MARK).join("").trim(),
          at: it.created_at, owner: owner
        });
      });
      boardCache = list;
      cb(list, true);
    }).catch(function(e){ boardErr((e && e.message) || "网络错误"); boardCache = boardReadLocal(); cb(boardCache, false); });
    return;
  }
  if(BOARD_MODE === "remote" && BOARD_CFG.url){
    if(typeof fetch !== "function"){ boardErr("浏览器不支持 fetch"); boardCache = boardReadLocal(); cb(boardCache, false); return; }
    var u = BOARD_CFG.url.replace(/\/$/, "") + "/rest/v1/board?select=name,text,at&order=at.desc&limit=100";
    fetch(u, {headers:boardHeaders()})
      .then(function(r){
        if(!r.ok) return r.text().then(function(t){ throw new Error("HTTP " + r.status + " " + t.slice(0,120)); });
        return r.json();
      })
      .then(function(j){ if(Array.isArray(j)){ boardCache = j; cb(boardCache, true); } else { boardCache = boardReadLocal(); cb(boardCache, false); } })
      .catch(function(e){ boardErr((e && e.message) ? e.message : "网络错误"); boardCache = boardReadLocal(); cb(boardCache, false); });
  } else {
    boardCache = boardReadLocal();
    cb(boardCache, false);
  }
}
function boardIsOwner(name){
  var v = String(name || "").trim().replace(/^["“”']+|["“”']+$/g, "").trim();
  return v === BOARD_OWNER_KEY;
}
function boardAdd(name, text, done){
  var owner = boardIsOwner(name);
  var body = text + (owner ? "\n\n" + BOARD_OWNER_MARK : "");
  var post = {name:(owner ? BOARD_OWNER_NAME : name), text:body, at:new Date().toISOString()};
  if(BOARD_MODE === "github"){
    if(typeof fetch !== "function"){ toast("浏览器不支持 fetch"); done(false); return; }
    ghApi("/repos/" + BOARD_CFG.owner + "/" + BOARD_CFG.repo + "/issues", {
      method:"POST",
      headers:boardHeaders({"Content-Type":"application/json"}),
      body:JSON.stringify({title:"建议｜" + (owner ? BOARD_OWNER_NAME : name), body:body})
    }).then(function(){ done(true); }).catch(function(e){ toast("发布失败：" + ((e && e.message) || "网络")); done(false); });
    return;
  }
  if(BOARD_MODE === "remote" && BOARD_CFG.url){
    fetch(BOARD_CFG.url.replace(/\/$/, "") + "/rest/v1/board", {
      method:"POST",
      headers:boardHeaders({"Content-Type":"application/json", Prefer:"return=minimal"}),
      body:JSON.stringify(post)
    }).then(function(r){
      if(r.ok) return done(true);
      return r.text().then(function(t){ toast("发布失败：" + r.status + " " + t.slice(0,80)); done(false); });
    }).catch(function(){ toast("发布失败：网络不通"); done(false); });
  } else {
    var arr = boardReadLocal();
    post.at = new Date().toISOString();
    arr.unshift(post);
    boardWriteLocal(arr);
    done(true);
  }
}
function boardCount(){ return boardReadLocal().length; }
function refreshBoardBadge(){
  var b = document.getElementById("boardBadge");
  if(!b) return;
  var n = BOARD_MODE === "remote" ? boardCache.length : boardReadLocal().length;
  b.textContent = n ? String(n) : "";
  b.style.display = n ? "" : "none";
}
function renderBoard(){
  var list = document.getElementById("boardList");
  var st = document.getElementById("boardState");
  if(!list) return;
  if(st){
    st.textContent = (BOARD_MODE === "github")
      ? "共享中（GitHub Issues）：所有人都能看，起个名字就能发"
      : (BOARD_MODE === "remote"
        ? "共享中：所有人都能看，发帖不用登录"
        : "当前只存在这台设备上（还没接共享存储）——同学的建议不会自动汇总到这里。");
  }
  boardLoad(function(arr){
    if(!arr.length){ list.innerHTML = '<div class="empty-hint" style="padding:18px 6px">还没有建议，来写第一条。</div>'; refreshBoardBadge(); return; }
    list.innerHTML = arr.map(function(p){
      var d = "";
      try{ d = new Date(p.at); d = (d.getMonth()+1) + "月" + d.getDate() + "日 " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }catch(e){}
      var on = p.owner || (String(p.name || "") === BOARD_OWNER_NAME && String(p.text || "").indexOf(BOARD_OWNER_MARK) >= 0);
      return '<div class="post"><div class="ph"><span class="pn' + (on ? " owner" : "") + '">' + esc(p.name || "匿名") + '</span>' +
        (on ? '<span class="tag-owner">站长</span>' : '') + '<span>' + esc(d) + '</span></div>' +
        '<div class="pt">' + esc(p.text || "") + '</div></div>';
    }).join("");
    refreshBoardBadge();
  });
}
function openBoard(){
  var m = document.getElementById("boardModal");
  if(!m) return;
  var nameEl = document.getElementById("boardName");
  if(nameEl && !nameEl.value){ try{ nameEl.value = localStorage.getItem(BOARD_NAME_KEY) || ""; }catch(e){} }
  m.classList.add("on");
  renderBoard();
}
function boardSubmit(){
  var nameEl = document.getElementById("boardName"), textEl = document.getElementById("boardText"), btn = document.getElementById("boardPostBtn");
  var name = (nameEl.value || "").trim(), text = (textEl.value || "").trim();
  if(!name){ toast("先给自己起个名字（随便写，方便大家认）"); nameEl.focus(); return; }
  if(!text){ toast("写点什么再发"); textEl.focus(); return; }
  if(text.length > 800) text = text.slice(0, 800);
  try{ localStorage.setItem(BOARD_NAME_KEY, name); }catch(e){}
  btn.disabled = true; btn.textContent = "发送中…";
  boardAdd(name, text, function(ok){
    btn.disabled = false; btn.textContent = "发布";
    if(!ok){ toast("发送失败，检查网络后再试"); return; }
    textEl.value = "";
    renderBoard();
    toast(BOARD_MODE === "remote" ? "已发布" : "已记在本机（还没接共享存储）");
  });
}
function boardDiag(){
  var st = document.getElementById("boardState");
  if(!st) return;
  st.style.color = "";
  st.textContent = "自检中…";
  var okRead = "?", okRepo = "?", okToken = "?";
  var p = "/repos/" + BOARD_CFG.owner + "/" + BOARD_CFG.repo;
  ghApi(p + "/issues?state=open&per_page=5", {headers:boardHeaders()})
    .then(function(){ okRead = "读 OK"; })
    .catch(function(e){ okRead = "读失败 " + ((e && e.message) || ""); })
    .then(function(){
      return ghApi(p, {headers:boardHeaders()}).then(function(j){
        okRepo = "仓库可访问";
        okToken = (j && j.permissions) ? ("权限：" + (j.permissions.push ? "可写" : "只读")) : "权限未知";
      }).catch(function(e){ okRepo = "仓库访问失败 " + ((e && e.message) || ""); });
    })
    .then(function(){
      st.style.color = "";
      st.textContent = "自检：" + okRead + " · " + okRepo + " · " + okToken;
      renderBoard();
    })
    .catch(function(){ st.textContent = "自检失败"; });
}

function buildBoard(){
  if(document.getElementById("boardModal")) return;
  var html = '<div class="sys-modal" id="boardModal"><div class="sys-card">' +
    '<div class="ch">建议栏<button type="button" data-close="boardModal">×</button></div>' +
    '<div class="cb">' +
      '<p class="board-state" id="boardState"></p>' +
      '<input class="board-name" id="boardName" maxlength="24" placeholder="你的名字（不用登录，写个代号就行）">' +
      '<textarea class="board-text" id="boardText" maxlength="800" placeholder="想加什么功能、哪里不好用、发现什么错误……直接写"></textarea>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">' +
        '<button class="sys-btn primary" type="button" id="boardPostBtn">发布</button>' +
        '<button class="sys-btn" type="button" id="boardReload">刷新</button>' +
        '<button class="sys-btn" type="button" id="boardDiag">自检</button>' +
      '</div>' +
      '<div id="boardList" style="margin-top:12px"></div>' +
    '</div>' +
    '<div class="cf"><button class="sys-btn" type="button" data-close="boardModal">关闭</button></div>' +
  '</div></div>';
  var wrap = document.createElement("div");
  wrap.innerHTML = html;
  while(wrap.firstChild) document.body.appendChild(wrap.firstChild);
  document.getElementById("boardPostBtn").onclick = boardSubmit;
  document.getElementById("boardReload").onclick = renderBoard;
  document.getElementById("boardDiag").onclick = boardDiag;
  document.querySelector('[data-close="boardModal"]').onclick = function(){ document.getElementById("boardModal").classList.remove("on"); };
  document.getElementById("boardModal").addEventListener("click", function(e){ if(e.target === this) this.classList.remove("on"); });
  refreshBoardBadge();
}

/* ---- 初始化 ---- */
function initExtra(){
  /* 持久化存储：开机顺手申请一次 */
  try{ sysAskPersist(); }catch(e){}
  /* 常亮 */
  try{ wakeWanted = localStorage.getItem(WAKE_KEY) === "1"; }catch(e){}
  applyWakeUI();
  var wb = document.getElementById("btnWake");
  if(wb) wb.onclick = toggleWake;
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && wakeWanted && !wakeSentinel && wakeSupported()){
      navigator.wakeLock.request("screen").then(function(s){ wakeSentinel = s; }).catch(function(){});
    }
  });
  /* 折叠 */
  var folded = false;
  try{ folded = localStorage.getItem(FOLD_KEY) === "1"; }catch(e){}
  applyFold(folded);
  var fb = document.getElementById("btnFold");
  if(fb) fb.onclick = toggleFold;
  /* 建议栏 */
  buildBoard();
  var bb = document.getElementById("btnBoard");
  if(bb) bb.onclick = openBoard;
  refreshBoardBadge();
  /* 设置里补两行 */
  var host = document.getElementById("sysAboutAnchor");
  if(host){
    host.insertAdjacentHTML("beforebegin",
      '<div class="sys-row"><div class="lbl">本机存储<span class="sub" id="sysStorageText">查询中…</span></div><button class="sys-btn" type="button" id="sysPersistBtn">申请持久化</button></div>' +
      '<div class="sys-row"><div class="lbl">屏幕常亮<span class="sub">背诵时不自动锁屏</span></div><button class="sys-btn" type="button" id="sysWakeBtn">切换</button></div>' +
      '<div class="sys-row"><div class="lbl">顶栏折叠<span class="sub">收起题型条与开关，腾出屏幕</span></div><button class="sys-btn" type="button" id="sysFoldBtn">切换</button></div>');
    document.getElementById("sysPersistBtn").onclick = sysAskPersist;
    document.getElementById("sysWakeBtn").onclick = toggleWake;
    document.getElementById("sysFoldBtn").onclick = toggleFold;
  }
  try{ refreshStorageRow(); }catch(e){}
}

function boot(){
  loadUI();
  loadFS();
  loadAll();
  bindUI();
  renderAll();
  initSys();
  initExtra();
  setTimeout(function(){ sysCheck(true); }, 1800);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") sysCheck(true);
  });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
