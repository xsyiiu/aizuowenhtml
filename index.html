<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>考研英语大作文 · 交互模板 v2.3.2</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --card2:#f1ede4; --line:#e3ddd1; --line2:#cdc4b5;
  --fg:#20242b; --dim:#5b6472; --dim2:#8b929d;
  --accent:#b25f16; --accent-bg:rgba(178,95,22,.10);
  --blue:#2c66c4; --blue-bg:rgba(44,102,196,.10);
  --ok:#1c8a5f; --danger:#c0392b;
  --fs:1; --radius:14px; --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 18% -12%,#fffdf7 0%,transparent 62%),var(--bg);
  color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:calc(15px * var(--fs));line-height:1.55;
  padding-bottom:90px; overflow-x:hidden;
}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 40px}
header.top{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(253,251,246,.92);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:8px 14px}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo{width:calc(34px * var(--fs));height:calc(34px * var(--fs));border-radius:10px;background:linear-gradient(145deg,#d4822a,#a9550f);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:calc(18px * var(--fs));flex:none;box-shadow:0 4px 14px rgba(150,80,20,.18)}
.brand h1{font-size:calc(15px * var(--fs));margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:calc(11px * var(--fs));color:var(--dim2)}
.ver{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-radius:99px;font-size:calc(10px * var(--fs));color:var(--accent);background:var(--accent-bg)}
.bar-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--fg);padding:7px 11px;border-radius:10px;font-size:calc(13px * var(--fs));
  transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:#f4efe6}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(145deg,#c4711f,#a75712);color:#fff;border:none;font-weight:700;box-shadow:0 3px 10px rgba(150,80,20,.18)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.row2{display:flex;gap:10px;align-items:flex-start;margin-top:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:1 1 420px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:99px;font-size:calc(12.5px * var(--fs));color:var(--dim);white-space:nowrap}
.chip.on{background:var(--accent-bg);border-color:rgba(178,95,22,.45);color:var(--accent);font-weight:600}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.sel{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:calc(12.5px * var(--fs));max-width:230px}
.sw{display:inline-flex;align-items:center;gap:5px;font-size:calc(12px * var(--fs));color:var(--dim);border:1px solid var(--line);
  padding:5px 9px;border-radius:99px;background:var(--card);user-select:none}
.sw input{accent-color:var(--accent);margin:0}
.sw.on{color:var(--fg);border-color:rgba(178,95,22,.45)}
.layout{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media(min-width:1000px){
  html[data-ui="auto"] .layout{grid-template-columns:300px minmax(0,1fr)}
  html[data-ui="auto"] .side{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}
}
html[data-ui="desktop"] .layout{grid-template-columns:minmax(220px,300px) minmax(0,1fr)}
html[data-ui="desktop"] .side{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}
html[data-ui="desktop"] .chips{flex-wrap:wrap;overflow:visible}
html[data-ui="mobile"] .wrap{max-width:560px}
html[data-ui="mobile"] .side{position:static;max-height:none;overflow:visible}
html[data-ui="mobile"] .en{font-size:calc(16px * var(--fs));line-height:1.7}
html[data-ui="mobile"] .pblock{padding:12px 12px 4px}
html[data-ui="mobile"] .bar{padding:8px 10px}
html[data-ui="mobile"] .btn{padding:6px 9px;font-size:calc(12.5px * var(--fs))}
html[data-ui="mobile"] .brand h1{font-size:calc(14px * var(--fs))}
html[data-ui="mobile"] .controls{width:100%}
html[data-ui="mobile"] .chips{flex:1 1 100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.side h3,.ptitle{font-size:calc(12px * var(--fs));letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin:0 0 10px}
.field{margin-bottom:9px}
.field label{display:block;font-size:calc(11.5px * var(--fs));color:var(--dim);margin-bottom:3px}
.field input,.field select{width:100%;background:#fffdfa;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:calc(13px * var(--fs))}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.field .hint{font-size:calc(10.5px * var(--fs));color:var(--dim2);margin-top:2px}
.side-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:#f7f3ea;border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:none;background:transparent;color:var(--dim);padding:5px 4px;border-radius:6px;font-size:calc(12px * var(--fs))}
.seg button.on{background:var(--card2);color:var(--fg);font-weight:600}
preview{display:block}
.pblock{background:linear-gradient(180deg,#ffffff,#fdfaf4);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(60,45,20,.04);padding:14px 14px 6px;margin-bottom:14px}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pnum{width:calc(24px * var(--fs));height:calc(24px * var(--fs));border-radius:8px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-size:calc(12px * var(--fs));font-weight:700;flex:none}
.phead h2{font-size:calc(14px * var(--fs));margin:0;font-weight:700}
.phead .tag{font-size:calc(10.5px * var(--fs));color:var(--dim2);border:1px solid var(--line);padding:1px 6px;border-radius:99px}
.phead .tools{margin-left:auto;display:flex;gap:6px}
.mini{border:1px solid var(--line);background:transparent;color:var(--dim);font-size:calc(11px * var(--fs));padding:3px 8px;border-radius:8px}
.mini:hover{color:var(--fg);border-color:var(--line2)}
.sent{border-top:1px dashed var(--line);padding:11px 0}
.sent:first-of-type{border-top:none}
.sent-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sent-label{font-size:calc(11.5px * var(--fs));color:var(--accent);font-weight:600;letter-spacing:.02em}
.sent-sel{flex:1 1 160px;min-width:120px;background:#fffdfa;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:calc(11.5px * var(--fs));color:var(--dim)}
.sent-sel:hover{color:var(--fg)}
.en{font-family:var(--serif);font-size:calc(17.5px * var(--fs));line-height:1.75;letter-spacing:.1px;color:#1c2128;word-break:break-word}
@media(max-width:600px){.en{font-size:calc(16px * var(--fs));line-height:1.7}}
.zh{font-size:calc(12.5px * var(--fs));line-height:1.7;color:var(--dim);margin-top:5px;padding-left:9px;border-left:2px solid var(--line2)}
.note{font-size:calc(11.5px * var(--fs));color:#8a5a12;background:rgba(178,95,22,.06);border:1px solid rgba(178,95,22,.18);
  border-radius:8px;padding:5px 8px;margin-top:6px;line-height:1.6}
.note b{color:var(--accent)}
.slot{display:inline;border:none;background:var(--accent-bg);color:var(--accent);border-radius:6px;padding:1px 5px;
  margin:0 1px;font:inherit;font-family:var(--serif);border-bottom:1px dashed rgba(178,95,22,.45);line-height:1.5;transition:.12s}
.slot:hover{background:rgba(178,95,22,.15)}
.slot.filled{background:var(--blue-bg);color:#1f4f9e;border-bottom-color:rgba(44,102,196,.45)}
.slot.filled:hover{background:rgba(44,102,196,.18)}
.slot.empty{color:#96661c;opacity:1}
.slot.flash{outline:2px solid var(--accent);outline-offset:1px}
.slotdemo{background:var(--blue-bg);color:#1f4f9e;border-bottom:1px dashed rgba(44,102,196,.45);border-radius:6px;padding:1px 5px}
.hintbar{font-size:calc(12px * var(--fs));color:var(--dim);background:rgba(44,102,196,.05);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;margin-top:12px;line-height:1.7}
.empty-hint{text-align:center;color:var(--dim2);font-size:calc(13px * var(--fs));padding:26px 10px}
/* modal */
#modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(48,42,32,.42);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.sheet{width:100%;max-width:720px;max-height:86vh;background:#fffdfa;border:1px solid var(--line2);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(60,45,20,.18);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:760px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-head h4{margin:0;font-size:calc(14px * var(--fs))}
.sheet-head .sub{font-size:calc(11px * var(--fs));color:var(--dim2);margin-left:auto}
.sheet-body{overflow:auto;padding:10px 12px 4px;flex:1}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:10px;
  padding:8px 10px;margin-bottom:7px;transition:.12s}
.opt:hover{border-color:var(--line2);background:#f6f1e8}
.opt.cur{border-color:var(--accent);background:var(--accent-bg)}
.opt .oe{font-family:var(--serif);font-size:calc(14.5px * var(--fs));color:#1f2328;line-height:1.5}
.opt .oz{font-size:calc(11.5px * var(--fs));color:var(--dim);margin-top:2px}
.opt .onote{font-size:calc(10.5px * var(--fs));color:#8a5a12;margin-top:2px}
.sheet-foot{padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sheet-foot input[type=text]{flex:1 1 180px;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.sheet-foot input[type=text]:focus{outline:none;border-color:var(--accent)}
.numtoggle{display:flex;gap:2px;background:#f7f3ea;border:1px solid var(--line);border-radius:9px;padding:2px}
.numtoggle button{border:none;background:transparent;color:var(--dim2);padding:5px 8px;border-radius:6px;font-size:calc(11px * var(--fs))}
.numtoggle button.on{background:var(--card2);color:var(--fg)}
#snapPanel{position:fixed;right:12px;top:112px;z-index:150;width:min(360px,calc(100vw - 24px));background:#fffdfa;
  border:1px solid var(--line2);border-radius:14px;padding:10px;display:none;box-shadow:0 14px 40px rgba(60,45,20,.16)}
#snapPanel.on{display:block}
.snap{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 8px;margin-bottom:6px;font-size:calc(11.5px * var(--fs))}
.snap b{font-size:calc(12px * var(--fs))}
.snap button{margin-left:auto}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:300;opacity:0;transition:.22s;
  background:#2b3038;color:#fff;padding:9px 16px;border-radius:99px;font-size:calc(13px * var(--fs));font-weight:600;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#updateBar{display:none;background:linear-gradient(90deg,#fff3d4,#ffe9bd);border-bottom:1px solid #e6c98d;color:#7a4a06;
  font-size:calc(12.5px * var(--fs));padding:7px 14px;text-align:center}
#updateBar.on{display:block}
#updateBar b{color:#8a5209}
.foot{margin-top:18px;color:var(--dim2);font-size:calc(11px * var(--fs));line-height:1.8;text-align:center}
.foot a{color:var(--dim)}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:calc(11px * var(--fs));color:var(--dim2);margin-top:8px}
.stats b{color:var(--accent);font-weight:700}
.fontctl{display:inline-flex;align-items:center;gap:1px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);padding:2px 4px}
.fontctl button{border:none;background:transparent;color:var(--dim);font-size:calc(12px * var(--fs));padding:3px 7px;border-radius:99px;font-weight:700}
.fontctl button:hover{background:var(--card2);color:var(--fg)}
.fontctl span{font-size:calc(11px * var(--fs));color:var(--dim2);min-width:36px;text-align:center;cursor:pointer;user-select:none}
.warn{color:#9a5a00;font-size:calc(11px * var(--fs));margin-top:6px;display:none}
.warn.on{display:block}
</style>
</head>
<body>
<div id="updateBar">发现新版本 <b id="newVer">—</b>，当前显示的是旧缓存。<button class="mini" id="btnReload" style="margin-left:8px">立即刷新</button></div>
<header class="top">
  <div class="bar">
    <div class="row1">
      <div class="brand">
        <div class="logo">作</div>
        <div>
          <h1>考研英语大作文 · 交互模板</h1>
          <p>27版讲义全量拆解 · <span class="ver" id="verChip">v2.3.2</span> · 点短语即换</p>
        </div>
      </div>
      <div class="bar-actions">
        <button class="btn ghost" id="btnUI" title="切换界面：自动 / 手机 / 电脑">界面：自动</button>
        <button class="btn ghost" id="btnUndo" title="撤销">↶ 撤销</button>
        <button class="btn ghost" id="btnRedo" title="重做">↷ 重做</button>
        <button class="btn ghost" id="btnSnap">快照</button>
        <button class="btn ghost danger" id="btnClear">清空</button>
        <button class="btn primary" id="btnCopyAll">复制全文</button>
      </div>
    </div>
    <div class="row2">
      <div class="chips" id="typeChips"></div>
      <div class="controls">
        <select class="sel" id="presetSel" title="真题预设"></select>
        <label class="sw on"><input type="checkbox" id="tgZh" checked><span>中英对照</span></label>
        <label class="sw"><input type="checkbox" id="tgLite"><span>考场精简</span></label>
        <label class="sw on"><input type="checkbox" id="tgNote" checked><span>注释</span></label>
        <label class="sw on"><input type="checkbox" id="tgGram" checked><span>自动语法</span></label>
        <div class="fontctl" title="调整字号：全站文字（点百分比可复位）">
          <button id="fsMinus" aria-label="缩小字号">A−</button>
          <span id="fsVal">100%</span>
          <button id="fsPlus" aria-label="放大字号">A＋</button>
        </div>
      </div>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="hintbar">用法：点句子里的<span class="slotdemo">彩色短语</span>换说法 → 左侧填题干词 → 每句上方下拉换整句方案。未填的槽位显示【标签】。</div>
  <div class="layout">
    <aside class="side">
      <div class="card">
        <h3>题干词 · 快速填写</h3>
        <div class="seg" id="sideSeg">
          <button data-tab="core" class="on">核心</button>
          <button data-tab="data">数据</button>
          <button data-tab="arg">论述</button>
        </div>
        <div id="slotForm"></div>
        <div class="seg" style="margin-top:12px">
          <button class="on" id="p3modeBtn1" data-mode="measure">第三段：措施</button>
          <button id="p3modeBtn2" data-mode="trend">趋势预测</button>
        </div>
        <div class="field">
          <label>原因连接词方案</label>
          <select id="connSel"></select>
        </div>
        <div class="side-actions">
          <button class="btn ghost" id="btnCopyP1" style="flex:1">复制第一段</button>
          <button class="btn ghost" id="btnCopyP2" style="flex:1">复制第二段</button>
        </div>
        <div class="warn" id="verWarn"></div>
      </div>
    </aside>
    <section id="preview"></section>
  </div>
  <div class="foot">
    <div>版本 <b id="footVer">v2.3.2</b> · 构建 2026-11-03 · 数据仅存本机浏览器（localStorage）</div>
    <div>讲义来源：《27考研英语大作文模板（英一英二通用）》 · 交互层为自制，例句与公式均按原文收录</div>
    <div style="margin-top:6px"><button class="mini" id="btnForce">强制刷新（清缓存取新版）</button> · <a href="./xiaozuowen.html" style="color:var(--dim)">小作文 →</a></div>
  </div>
</main>
<div id="snapPanel"></div>
<div id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h4 id="mTitle">选择短语</h4>
      <span class="sub" id="mSub"></span>
      <button class="mini" id="mClose">关闭</button>
    </div>
    <div class="sheet-body" id="mBody"></div>
    <div class="sheet-foot">
      <input type="text" id="mInput" placeholder="也可手动输入…">
      <div class="numtoggle" id="mNum">
        <button data-num="sg" class="on">单数</button>
        <button data-num="pl">复数</button>
      </div>
      <button class="btn" id="mApply">应用</button>
      <button class="btn ghost danger" id="mClear">清除</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
/* ============ 版本 ============ */
const APP_VERSION = '2.3.2';
const BUILD_DATE  = '2026-11-03';

/* ============ 词库（全部来自讲义；note 标注适用语境） ============ */
const BANK = {};
function B(id, label, hint, opts){ BANK[id] = {label:label, hint:hint, opts:opts}; }

B("theme","主题词","题干里的写作对象（实体/现象/概念）",[
  {en:"elderly-care robots",zh:"养老机器人",num:"pl",note:"26英一·科技+养老（双图表）"},
  {en:"children's outdoor activities",zh:"儿童户外活动",num:"pl",note:"26英二·教育+健康（静态图）"},
  {en:"labor practice courses",zh:"劳动实践课",num:"pl",note:"24英二·教育实践（静态图）"},
  {en:"infrastructure construction",zh:"基础设施建设",num:"sg",note:"24英一·城市建设（图画+图表）"},
  {en:"the health literacy level of Chinese residents",zh:"中国居民健康素养水平",num:"sg",note:"23英二·健康（动态单方向）"},
  {en:"graduates' choices",zh:"毕业生选择",num:"pl",note:"19英二·就业（动态多方向）"},
  {en:"the ownership of household appliances",zh:"家用电器拥有量",num:"sg",note:"25英一·消费（表格）"},
  {en:"traditional culture",zh:"传统文化",num:"sg",note:"23英一·文化传承（图画）"},
  {en:"environmental protection",zh:"环境保护",num:"sg",note:"11英一·环保（图画）"},
  {en:"lifelong learning",zh:"终身学习",num:"sg",note:"意志品质/学习类通用"},
  {en:"teamwork and cooperation",zh:"团队合作",num:"pl",note:"08/23英一·合作（图画）"},
  {en:"the Internet",zh:"互联网",num:"sg",note:"09/15英一·网络（争议话题）"},
  {en:"mobile phones",zh:"手机",num:"pl",note:"15英一·手机时代的聚会"},

function cloneReasons(suffix, connTag){
  return REASONS.map(function(v){
    var en=v.en, zh=v.zh;
    if(connTag && en.indexOf("For instance, ") === 0){ en = en.slice(14); zh = zh.replace(/^例如，/, ""); }
    RENAME.forEach(function(k){
      en = en.split("{"+k+"}").join("{"+k+suffix+"}");
      zh = zh.split("{"+k+"}").join("{"+k+suffix+"}");
    });
    if(connTag){ en = "{"+connTag+"} " + en; zh = "{"+connTag+"} " + zh; }
    return {n:v.n, en:en, zh:zh, note:v.note};
  });
}

function getSlot(id){
  var s = state.slots[id];
  return (s && typeof s.v === "string" && s.v.length) ? s : null;
}
function findOpt(id, en){
  var arr = slotOpts(id);
  for(var i=0;i<arr.length;i++){ if(arr[i].en === en) return arr[i]; }
  for(var k in BANK){
    var a = BANK[k].opts;
    for(var j=0;j<a.length;j++){ if(a[j].en === en) return a[j]; }
  }
  return null;
}
function setSlot(id, v, zh, num){
  if(!v){ delete state.slots[id]; return; }
  var o = findOpt(id, v);
  state.slots[id] = {v:v, zh:(zh|| (o && o.zh) || zhFor(id,v)), num:(num || (o && o.num) || "")};
}
function autoText(id, mode){
  var style = CONN_STYLES[state.conn] || CONN_STYLES[0];
  var idx = AUTO[id];
  if(mode === "zh"){
    var map = {c1:"首先，",c2:"其次，",c3:"最后，"};
    return (style.c[idx-1] ? map[id] : "");
  }
  return style.c[idx-1] || "";
}
function expand(raw, mode, depth){
  if(depth > 4) return raw;
  return String(raw).replace(/\{([A-Za-z0-9_]+)\}/g, function(m, key){
    return slotText(key, mode, depth+1);
  });
}
function slotText(id, mode, depth){
  if(AUTO[id]) return autoText(id, mode);
  var st = getSlot(id);
  if(!st) return "【" + slotLabel(id) + "】";
  var raw = (mode === "zh") ? (st.zh || st.v) : st.v;
  if(raw.indexOf("{") >= 0 && (depth||0) < 4){
    var sub = segmentsOf(raw, mode, {nested:true, depth:(depth||0)+1});
    return sub.map(function(x){ return x.s; }).join("").replace(/\s+/g, " ");
  }
  return raw;
}

var PLURAL_TO_SG = {};
Object.keys(VERB_PAIRS).forEach(function(k){ PLURAL_TO_SG[VERB_PAIRS[k]] = k; });
var BASE_TO_SG = {run:"runs",stand:"stands",sit:"sits",stay:"stays",improve:"improves",increase:"increases",
  provide:"provides",enable:"enables",help:"helps",play:"plays",show:"shows",remain:"remains",create:"creates"};

function toPluralVerb(v){
  var low = v.toLowerCase();
  if(VERB_PAIRS[low]) return matchCase(v, VERB_PAIRS[low]);
  return v;
}
function toSingularVerb(v){
  var low = v.toLowerCase();
  if(PLURAL_TO_SG[low]) return matchCase(v, PLURAL_TO_SG[low]);
  if(BASE_TO_SG[low]) return matchCase(v, BASE_TO_SG[low]);
  return v;
}
function matchCase(src, out){
  if(src[0] === src[0].toUpperCase()) return out.charAt(0).toUpperCase() + out.slice(1);
  return out;
}

function applyAgreement(segs){
  for(var i=0;i<segs.length-1;i++){
    var a = segs[i], b = segs[i+1];
    if(a.t === "slot" && b.t === "text"){
      var m = b.s.match(/^(\s+)([A-Za-z]+)/);
      var prevText = (i > 0 && segs[i-1].t === "text") ? segs[i-1].s : "";
      var afterAux = /\b(does|do|did|is|are|was|were|has|have|had|can|could|will|would|should|may|might|must)\s+$/i.test(prevText);
      if(m && a.filled && !afterAux){
        var verb = m[2];
        var num = a.num;
        if(!num){
          var st = getSlot(a.id);
          num = st && st.num;
        }
        if(num === "pl"){
          var pv = toPluralVerb(verb);
          if(pv !== verb) b.s = m[1] + pv + b.s.slice(m[0].length);
        }else if(num === "sg"){
          var sv = toSingularVerb(verb);
          if(sv !== verb) b.s = m[1] + sv + b.s.slice(m[0].length);
        }
      }
    }
    if(a.t === "slot" && b.t === "text" && /^\s+$/.test(b.s) && segs[i+2] && segs[i+2].t === "slot" && segs[i+2].filled && a.filled){
      var numN = a.num || (getSlot(a.id) && getSlot(a.id).num);
      var pre = (i > 0 && segs[i-1].t === "text") ? segs[i-1].s : "";
      var auxBefore = /\b(does|do|did|is|are|was|were|has|have|had|can|could|will|would|should|may|might|must)\s*$/i.test(pre);
      var vm = segs[i+2].s.match(/^([A-Za-z]+)/);
      if(vm && !auxBefore){
        var v2 = vm[1], nv = v2;
        if(numN === "pl") nv = toPluralVerb(v2);
        else if(numN === "sg") nv = toSingularVerb(v2);
        if(nv !== v2) segs[i+2].s = nv + segs[i+2].s.slice(v2.length);
      }
    }
    if(a.t === "text" && b.t === "slot" && b.filled){
      var tail = a.s.match(/\b(does|is|has|was)\s+$/);
      var num2 = b.num || (getSlot(b.id) && getSlot(b.id).num);
      if(tail && num2 === "pl"){
        var rep = {does:"do", is:"are", has:"have", was:"were"}[tail[1]];
        a.s = a.s.replace(/\b(does|is|has|was)(\s+)$/, rep + "$2");
      }
    }
  }
}

function applyCaps(segs){
  var cap = true;
  for(var i=0;i<segs.length;i++){
    var seg = segs[i];
    if(seg.t === "slot"){
      if(cap && seg.filled && seg.s.length){
        seg.s = seg.s.charAt(0).toUpperCase() + seg.s.slice(1);

      cap = false;
      continue;
    }
    var s = seg.s, out = "";
    for(var j=0;j<s.length;j++){
      var ch = s[j];
      if(cap && /[A-Za-z]/.test(ch)){ out += ch.toUpperCase(); cap = false; continue; }

function applyCommaLower(segs){
  for(var i=0;i<segs.length;i++){
    if(segs[i].t !== "text") continue;
    segs[i].s = segs[i].s.replace(/,\s+([A-Z])([a-z]+)/g, function(m, a, rest){
      var w = (a + rest).toLowerCase();
      return LOWER_AFTER_COMMA[w] ? (", " + w) : m;
    });
    if(!/,\s*$/.test(segs[i].s)) continue;
    var j = i+1;
    while(j < segs.length && segs[j].t === "text" && /^\s*$/.test(segs[j].s)) j++;
    if(j >= segs.length) continue;
    var seg = segs[j];
    if(seg.t === "slot" && seg.filled){
      seg.s = seg.s.replace(/^([A-Z])([a-z]+)/, function(m, a, rest){
        var w = (a + rest).toLowerCase();
        return LOWER_AFTER_COMMA[w] ? w : m;
      });
    }else if(seg.t === "text"){
      seg.s = seg.s.replace(/^(\s*)([A-Z])([a-z]+)/, function(m, sp, a, rest){
        var w = (a + rest).toLowerCase();
        return LOWER_AFTER_COMMA[w] ? (sp + w) : m;
      });
    }
  }
}

/* 中文自然拼：去掉英文句前的连接词空格 */
function segmentsOf(tpl, mode, opts){
  opts = opts || {};
  var depth = opts.depth || 0;
  var out = [], parts = String(tpl).split(/(\{[A-Za-z0-9_]+\})/);
  for(var i=0;i<parts.length;i++){
    var part = parts[i];
    if(!part) continue;
    var m = part.match(/^\{([A-Za-z0-9_]+)\}$/);
    if(m){
      var id = m[1];
      if(AUTO[id]){ var at = autoText(id, mode); if(at) out.push({t:"text", s:at}); continue; }
      var st = getSlot(id);
      var txt = st ? slotText(id, mode, depth) : "【" + slotLabel(id) + "】";
      out.push({t:"slot", id:id, s:txt, filled:!!st, num:(st && st.num) || ""});
    }else{
      out.push({t:"text", s:part});
    }
  }
  if(state.toggles.gram){
    applyAgreement(out);
    if(!opts.nested) applyCaps(out);
    applyCommaLower(out);
  }
  // 中文行：去掉中文标点周围的空格
  if(mode === "zh"){
    for(var z=0;z<out.length;z++){
      out[z].s = out[z].s.replace(/\s+([，。；：、！？])/g, "$1").replace(/([，。；：、！？])\s+/g, "$1");
    }
    for(var z2=1;z2<out.length-1;z2++){
      if(out[z2].t === "text" && /^\s+$/.test(out[z2].s)){
        var pv = out[z2-1].s, nx = out[z2+1].s;
        if(/[，。；：、！？]$/.test(pv) || /^[，。；：、！？]/.test(nx)) out[z2].s = "";
      }
    }
  }
  // 清理空槽位带来的多余标点/空格
  for(var k=0;k<out.length;k++){
    if(out[k].t === "text"){
      out[k].s = out[k].s.replace(/,\s*,/g, ",").replace(/\(\s*\)/g, "").replace(/\s{2,}/g, " ");
    }
  }
  return out;
}

function plainOf(segs){
  var s = "";
  segs.forEach(function(x){ s += x.s; });
  return s.replace(/\s+/g, " ").replace(/\s+([,.!?:;])/g, "$1").trim();
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ============ 组段 ============ */
function paragraphsOf(){
  var t = TYPE_MAP[state.type] || TYPES[0];
  var p1 = {key:"p1", n:1, title:"第一段", tag:"描述 + 现象 / 主题", sents:t.p1.slice()};
  var p2 = {key:"p2", n:2, title:"第二段", tag:"过渡 + 原因", sents:P2.slice()};
  var p3 = state.p3mode === "trend"
    ? {key:"p3", n:3, title:"第三段", tag:"总结 + 趋势预测", sents:P3_TREND.slice()}
    : {key:"p3", n:3, title:"第三段", tag:"总结 + 措施 + 畅想", sents:P3_MEASURE.slice()};
  var arr = [p1,p2,p3];
  if(state.toggles.lite){
    arr.forEach(function(p){
      p.sents = p.sents.filter(function(s){
        if(s.optional) return false;
        if(p.key === "p2" && s.key === "p2d") return false;
        if(p.key === "p3" && s.key === "p3c") return false;
        return true;
      });
    });
  }
  return arr;
}
function variantOf(sent){
  var i = state.picks[sent.key];
  if(typeof i !== "number" || i < 0 || i >= sent.vs.length) i = 0;
  return sent.vs[i];
}
function pickOf(sent){
  var i = state.picks[sent.key];
  return (typeof i === "number" && i >= 0 && i < sent.vs.length) ? i : 0;
}

function renderPresets(){
  var sel = document.getElementById("presetSel");
  var cur = sel.value;
  sel.innerHTML = '<option value="">— 载入真题预设 —</option>';
  var groups = {};
  PRESETS.forEach(function(p){
    var g = TYPE_MAP[p.type] ? TYPE_MAP[p.type].group : "其他";
    if(!groups[g]){ groups[g] = document.createElement("optgroup"); groups[g].label = g; sel.appendChild(groups[g]); }
    var o = document.createElement("option");
    o.value = p.id; o.textContent = p.name;
    groups[g].appendChild(o);
  });
  sel.value = cur || "";
  sel.onchange = function(){
    var p = null;
    PRESETS.forEach(function(x){ if(x.id === sel.value) p = x; });
    if(!p) return;
    snapshot("切换前 · " + (TYPE_MAP[state.type] ? TYPE_MAP[state.type].label : ""));
    pushHistory();
    applyPreset(p);
    persist(); renderAll();
    toast("已载入：" + p.name);
  };
}
function applyPreset(p){
  var s = emptyState();
  s.type = p.type;
  var merged = {};
  for(var k in BASE) merged[k] = BASE[k];
  for(var k2 in p.slots) merged[k2] = p.slots[k2];
  for(var k3 in merged){
    var v = merged[k3];
    if(v === "" || v === null || v === undefined) continue;
    var opt = findOpt(k3, v);
    s.slots[k3] = {v:v, zh:(opt && opt.zh) || zhFor(k3, v), num:(opt && opt.num) || ""};
  }
  for(var k4 in p.picks) s.picks[k4] = p.picks[k4];
  state = s;
}

function renderPreview(){
  var box = document.getElementById("preview");
  var paras = paragraphsOf();
  var html = "", totalWords = 0;
  var filled = 0;
  for(var kk in state.slots){ if(state.slots[kk] && state.slots[kk].v) filled++; }
  if(!filled){
    html += '<div class="hintbar" style="margin:0 0 12px">还没有填任何内容：先在上方选一个<b>真题预设</b>，或直接点下面的【标签】逐词填。所有彩色标签点开都有词库。</div>';
  }
  paras.forEach(function(p){
    var inner = "", pWords = 0;
    p.sents.forEach(function(sent){
      var idx = pickOf(sent);
      var varnt = sent.vs[idx];
      if(varnt.skip) return;
      var segsEn = segmentsOf(varnt.en, "en");
      var segsZh = segmentsOf(varnt.zh, "zh");
      var en = plainOf(segsEn), zh = plainOf(segsZh);
      pWords += en.split(/\s+/).filter(Boolean).length;
      inner += '<div class="sent" data-sent="' + sent.key + '">' +
        '<div class="sent-head"><span class="sent-label">' + esc(sent.label) + '</span>' +
        '<select class="sent-sel" data-pick="' + sent.key + '">' +
          sent.vs.map(function(v, i){
            return '<option value="' + i + '"' + (i === idx ? ' selected' : '') + '>' + esc(v.n) + '</option>';
          }).join("") +
        '</select></div>' +
        '<div class="en">' + htmlOf(segsEn) + '</div>' +
        (state.toggles.zh ? '<div class="zh">' + htmlOf(segsZh) + '</div>' : '') +
        (state.toggles.note && varnt.note ? '<div class="note"><b>注</b> ' + esc(varnt.note) + '</div>' : '') +
        '</div>';
    });
    totalWords += pWords;
    html += '<div class="pblock">' +
      '<div class="phead"><span class="pnum">' + p.n + '</span><h2>' + p.title + '</h2>' +
      '<span class="tag">' + esc(p.tag) + '</span>' +
      '<div class="tools"><span class="tag">' + pWords + ' words</span>' +
      '<button class="mini" data-copy-p="' + p.key + '">复制本段</button></div></div>' +
      inner + '</div>';
  });
  html += '<div class="stats"><span>全文 <b>' + totalWords + '</b> words</span>' +
          '<span>题型 <b>' + TYPES.length + '</b></span><span>预设 <b>' + PRESETS.length + '</b></span>' +
          '<span>句子方案 <b>' + countVariants() + '</b></span>' +
          '<span>词库短语 <b>' + countOptions() + '</b></span></div>';
  box.innerHTML = html;

  Array.prototype.forEach.call(box.querySelectorAll("select[data-pick]"), function(sel){
    sel.onchange = function(){
      pushHistory();
      state.picks[sel.getAttribute("data-pick")] = parseInt(sel.value,10) || 0;
      persist(); renderPreview();
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll("button[data-copy-p]"), function(b){
    b.onclick = function(){
      var key = b.getAttribute("data-copy-p");
      var p = paragraphsOf().filter(function(x){ return x.key === key; })[0];
      copyText(paragraphText(p));
      toast("已复制" + p.title);
    };
  });
}
function htmlOf(segs){
  var out = "";
  segs.forEach(function(seg){
    if(seg.t === "text"){ out += esc(seg.s); }
    else{
      out += '<button class="slot ' + (seg.filled ? "filled" : "empty") + '" data-slot="' + seg.id + '">' + esc(seg.s) + '</button>';
    }
  });
  return out;
}
function paragraphText(p){
  return p.sents.filter(function(s){ return !variantOf(s).skip; })
    .map(function(s){ return plainOf(segmentsOf(variantOf(s).en, "en")); }).join(" ");
}
function countVariants(){
  var n = 0;
  TYPES.forEach(function(t){ t.p1.forEach(function(s){ n += s.vs.length; }); });
  P2.forEach(function(s){ n += s.vs.length; });
  P3_MEASURE.forEach(function(s){ n += s.vs.length; });
  P3_TREND.forEach(function(s){ n += s.vs.length; });
  return n;
}
function countOptions(){
  var n = 0;
  for(var k in BANK) n += BANK[k].opts.length;
  return n;
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 1600);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

/* ============ 版本 / 更新 ============ */
function compareVer(a, b){
  var x = a.split(".").map(Number), y = b.split(".").map(Number);
  for(var i=0;i<3;i++){ if((x[i]||0) !== (y[i]||0)) return (x[i]||0) - (y[i]||0); }
  return 0;
}
function repoInfo(){
  var h = location.hostname || "";
  if(!/github\.io$/.test(h)) return null;
  var owner = h.split(".")[0];
  var parts = (location.pathname || "/").split("/").filter(Boolean);
  if(!parts.length) return null;
  var repo = parts[0];
  var rest = parts.slice(1).join("/") || "index.html";
  return {owner:owner, repo:repo, path:rest, branch:"main"};
}
function checkUpdate(silent){
  if(typeof fetch !== "function"){ if(!silent) toast("当前浏览器不支持自动检查更新"); return; }
  var info = repoInfo();
  if(!info){ if(!silent) toast("本地打开，跳过在线检查"); return; }
  var url = "https://raw.githubusercontent.com/" + info.owner + "/" + info.repo + "/" + info.branch + "/" + info.path + "?t=" + Date.now();
  fetch(url, {cache:"no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
    var m = txt.match(/APP_VERSION\s*=\s*'([0-9.]+)'/);
    if(m && compareVer(m[1], APP_VERSION) > 0){
      document.getElementById("newVer").textContent = "v" + m[1] + "（当前 v" + APP_VERSION + "）";
      document.getElementById("updateBar").classList.add("on");
    } else if(!silent){ toast("已是最新版本 v" + APP_VERSION); }
  }).catch(function(){ if(!silent) toast("检查更新失败（网络）"); });
}
function forceReload(){
  var u = location.pathname + "?v=" + Date.now();
  location.replace(u);
}


/* ============ 界面模式 ============ */
var UI_KEY = "xrz-ui-mode";
function applyUI(mode){
  document.documentElement.setAttribute("data-ui", mode);
  var b = document.getElementById("btnUI");
  var map = {auto:"界面：自动", mobile:"界面：手机", desktop:"界面：电脑"};
  if(b) b.textContent = map[mode] || map.auto;
}
function loadUI(){
  var m = "auto";
  try{ m = localStorage.getItem(UI_KEY) || "auto"; }catch(e){}
  if(["auto","mobile","desktop"].indexOf(m) < 0) m = "auto";
  applyUI(m);
}
function cycleUI(){
  var order = ["auto","mobile","desktop"];
  var cur = document.documentElement.getAttribute("data-ui") || "auto";
  var next = order[(order.indexOf(cur)+1) % 3];
  try{ localStorage.setItem(UI_KEY, next); }catch(e){}
  applyUI(next);
  var msg = {auto:"界面：跟随屏幕宽度", mobile:"界面：手机版（单栏窄屏）", desktop:"界面：电脑版（左侧栏 + 正文）"}[next];
  if(next === "desktop" && window.innerWidth < 760) msg += "，屏幕较窄建议横屏";
  toast(msg);
}


/* ============ 字号 ============ */
var FS_KEY = "xrz-font-scale";
var FS_STEPS = [0.85, 1, 1.15, 1.3, 1.5, 1.75, 2, 2.5, 3];
var fsIndex = 1;
function applyFS(){
  var v = FS_STEPS[fsIndex];
  document.documentElement.style.setProperty("--fs", String(v));
  var el = document.getElementById("fsVal");
  if(el) el.textContent = Math.round(v * 100) + "%";
}
function loadFS(){
  var raw = null;
  try{ raw = localStorage.getItem(FS_KEY); }catch(e){}
  var v = parseFloat(raw);
  var i = FS_STEPS.indexOf(v);
  fsIndex = i >= 0 ? i : 1;
  applyFS();
}
function stepFS(d){
  fsIndex = Math.max(0, Math.min(FS_STEPS.length - 1, fsIndex + d));
  try{ localStorage.setItem(FS_KEY, String(FS_STEPS[fsIndex])); }catch(e){}
  applyFS();
  toast("字号 " + Math.round(FS_STEPS[fsIndex] * 100) + "%");
}
function resetFS(){
  fsIndex = 1;
  try{ localStorage.setItem(FS_KEY, "1"); }catch(e){}
  applyFS();
  toast("字号已复位 100%");
}

  };
  document.getElementById("btnClear").onclick = function(){
    snapshot("清空前 · " + (TYPE_MAP[state.type] ? TYPE_MAP[state.type].label : ""));
    pushHistory();
    state = emptyState();
    persist(); renderAll(); toast("已清空，可撤销");
  };
  document.getElementById("btnCopyAll").onclick = function(){
    var txt = paragraphsOf().map(function(p){
      return p.title + "\n" + paragraphText(p);
    }).join("\n\n");
    copyText(txt); toast("全文 " + txt.split(/\s+/).length + " 词，已复制");
  };
  document.getElementById("btnCopyP1").onclick = function(){
    var p = paragraphsOf()[0]; copyText(paragraphText(p)); toast("已复制第一段");
  };
  document.getElementById("btnCopyP2").onclick = function(){
    var p = paragraphsOf()[1]; copyText(paragraphText(p)); toast("已复制第二段");
  };
  document.getElementById("mClose").onclick = closeModal;
  document.getElementById("mApply").onclick = applyModalInput;
  document.getElementById("mClear").onclick = function(){
    if(!modalSlot) return;
    pushHistory(); delete state.slots[modalSlot];
    persist(); renderPreview(); renderSidebar(); closeModal();
  };
  document.getElementById("mInput").onkeydown = function(e){ if(e.key === "Enter") applyModalInput(); };
  document.getElementById("mNum").onclick = function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if(!b) return;
    this.querySelectorAll("button").forEach(function(x){ x.className = ""; });
    b.className = "on";
    if(modalSlot && getSlot(modalSlot)){
      state.slots[modalSlot].num = b.getAttribute("data-num");
      persist(); renderPreview();
    }
  };
  document.getElementById("modal").onclick = function(e){ if(e.target === this) closeModal(); };
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });
  document.getElementById("preview").onclick = function(e){
    var b = e.target.closest ? e.target.closest(".slot") : null;
    if(b){ openSlot(b.getAttribute("data-slot")); }
  };
  document.getElementById("btnUI").onclick = cycleUI;
  document.getElementById("fsMinus").onclick = function(){ stepFS(-1); };
  document.getElementById("fsPlus").onclick = function(){ stepFS(1); };
  document.getElementById("fsVal").onclick = resetFS;
  document.getElementById("btnForce").onclick = forceReload;
  document.getElementById("btnReload").onclick = forceReload;
}
function renderSnapPanel(){
  var panel = document.getElementById("snapPanel");
  if(!snapshots.length){ panel.innerHTML = '<div class="empty-hint">还没有快照。<br>切换预设或清空时会自动存。</div>'; return; }
  var html = '<div style="font-size:calc(12px * var(--fs));color:var(--dim2);margin-bottom:6px">快照（最多 8 个，点击恢复）</div>';
  snapshots.forEach(function(s, i){
    var d = new Date(s.ts);
    var time = (d.getMonth()+1) + "月" + d.getDate() + "日 " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    html += '<div class="snap"><div><b>' + esc(s.label) + '</b><br><span style="color:var(--dim2)">' + time + '</span></div>' +
            '<button class="mini" data-restore="' + i + '">恢复</button></div>';
  });
  panel.innerHTML = html;
  Array.prototype.forEach.call(panel.querySelectorAll("button[data-restore]"), function(b){
    b.onclick = function(){
      var idx = parseInt(b.getAttribute("data-restore"),10);
      var s = snapshots[idx];
      if(!s) return;
      snapshot("恢复前 · 当前");
      pushHistory();
      try{ state = JSON.parse(s.state); }catch(e){ return; }
      persist(); renderAll(); toast("已恢复快照");
    };
  });
}

function boot(){
  loadUI();
  loadFS();
  loadAll();
  bindUI();
  renderAll();
  setTimeout(function(){ checkUpdate(true); }, 1800);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") checkUpdate(true);
  });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
