<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>考研政治史纲时间线+重大会议+一页纸口诀</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky bar with three jump links, then three stacked panels (map + period notes, meeting cards, drill deck). */
:root{
  --bg:#EDF1F4;--surface:#FFFFFF;--surface-2:#F5F8FA;--ink:#14212B;--mute:#586873;--line:#D3DBE0;
  --accent:#2B4FAE;--accent-ink:#FFFFFF;--accent-soft:#E4EAFA;
  --key:#CC3328;--key-soft:#FBE4E1;--gold:#85570A;--gold-soft:#FAEFD6;
  --ok:#1C7A4E;--ok-soft:#DDF1E6;--bad:#B3261E;--bad-soft:#FBE4E1;
  --sea:#DCE7EE;--land:#FBFCFC;--land-line:#9FB0BC;--hi:#F5D3CE;--hi-line:#CC3328;
  --shadow:0 1px 0 rgba(20,33,43,.04),0 10px 26px -16px rgba(20,33,43,.25);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B;--surface:#16212A;--surface-2:#1B2832;--ink:#E6EDF1;--mute:#93A3AE;--line:#2A3945;
    --accent:#8FA8F0;--accent-ink:#0E151B;--accent-soft:#1D2A4A;
    --key:#FF7A6E;--key-soft:#40201F;--gold:#E0B25A;--gold-soft:#3A2F14;
    --ok:#5FD39A;--ok-soft:#14352A;--bad:#FF8A80;--bad-soft:#40201F;
    --sea:#0B1218;--land:#1A2832;--land-line:#3C5160;--hi:#5A2A27;--hi-line:#FF7A6E;
    --shadow:0 10px 26px -16px rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B;--surface:#16212A;--surface-2:#1B2832;--ink:#E6EDF1;--mute:#93A3AE;--line:#2A3945;
  --accent:#8FA8F0;--accent-ink:#0E151B;--accent-soft:#1D2A4A;
  --key:#FF7A6E;--key-soft:#40201F;--gold:#E0B25A;--gold-soft:#3A2F14;
  --ok:#5FD39A;--ok-soft:#14352A;--bad:#FF8A80;--bad-soft:#40201F;
  --sea:#0B1218;--land:#1A2832;--land-line:#3C5160;--hi:#5A2A27;--hi-line:#FF7A6E;
  --shadow:0 10px 26px -16px rgba(0,0,0,.7);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:2000;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1500;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.seal{flex:none;width:38px;height:38px;border-radius:8px;background:var(--key);color:#fff;display:grid;place-items:center;font:800 20px/1 var(--serif)}
h1{font:800 18px/1.3 var(--serif);letter-spacing:.02em}
.sub{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.jump{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.jump button{border:0;background:transparent;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500;color:var(--mute)}
.jump button:hover{color:var(--ink);background:var(--surface)}
.back{flex:none;display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;text-decoration:none;line-height:1.6}
.back:hover{border-color:var(--accent);color:var(--accent)}
.stat{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums;line-height:1.4}
.stat b{color:var(--ink);font-size:16px}

/* panels */
.page{max-width:1120px;margin:0 auto;padding-block:20px 56px;display:grid;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--topH,72px) + env(safe-area-inset-top,0px));min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--key-soft);color:var(--key)}
.badge.b2{background:var(--gold-soft);color:var(--gold)}
.badge.b3{background:var(--accent-soft);color:var(--accent)}
h2{font:800 19px/1.4 var(--serif)}
.now{margin-left:auto;font-size:13px;font-weight:700;color:var(--key);background:var(--key-soft);border-radius:8px;padding:3px 12px}
.btn{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 16px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:3px 12px;font-size:13px}
.tag{display:inline-block;border-radius:6px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.tag.m{background:var(--key-soft);color:var(--key)}
.tag.g{background:var(--gold-soft);color:var(--gold)}
b.k{color:var(--key);font-weight:800}

/* module 1 */
.mapgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px}
.mapbox{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#map{height:460px;width:100%;background:var(--sea);z-index:0;font-family:var(--sans)}
.mapbadge{position:absolute;top:10px;left:10px;z-index:900;max-width:calc(100% - 130px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.mapreset{position:absolute;right:10px;bottom:10px;z-index:900;background:var(--surface)}
.mapnote{position:absolute;left:10px;bottom:10px;z-index:900;font-size:11px;color:var(--mute);background:var(--surface);border-radius:6px;padding:0 8px;opacity:.9}
.leaflet-container{background:var(--sea);font:inherit}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content{margin:10px 14px;font-size:13px;line-height:1.5}
.leaflet-tooltip.ptip{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none;font-size:12px}
.leaflet-tooltip.ptip::before{display:none}
path.prov{fill:var(--land);stroke:var(--land-line);stroke-width:.8;fill-opacity:1;transition:fill .25s}
path.prov:hover{fill:var(--accent-soft)}
path.prov.hi{fill:var(--hi);stroke:var(--hi-line);stroke-width:1}
path.route{fill:none;stroke:var(--key);stroke-width:2.5;stroke-dasharray:7 6;stroke-linecap:round}
.plabel{font-size:10px;color:var(--mute);white-space:nowrap;text-align:center;pointer-events:none;letter-spacing:.04em}
#map:not(.z5) .plabel{display:none}
.pin span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 12px/1 var(--sans);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.places{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.places button{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 12px 2px 3px;font-size:12.5px;line-height:1.6;text-align:left}
.places button:hover{border-color:var(--accent)}
.places i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--sans);font-style:normal}
.steprow{display:flex;align-items:center;gap:8px;margin-top:14px}
.tl{position:relative;flex:1;min-width:0;padding-top:30px;--r:0}
.bubble{position:absolute;top:0;left:10px;background:var(--key);color:#fff;font-size:12px;font-weight:700;line-height:1.6;border-radius:6px;padding:0 9px;white-space:nowrap;pointer-events:none}
.gold .bubble{background:var(--gold)}
.tl input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:22px;margin:0;background:transparent;position:relative;z-index:2;cursor:grab;touch-action:pan-y}
.tl input[type=range]:active{cursor:grabbing}
.tl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--key) calc(10px + (100% - 20px)*var(--r)),var(--line) 0)}
.tl input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--key) calc(10px + (100% - 20px)*var(--r)),var(--line) 0)}
.tl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--key);border:4px solid var(--surface);box-shadow:0 0 0 1.5px var(--key),0 2px 6px rgba(0,0,0,.3)}
.tl input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--key);border:4px solid var(--surface);box-shadow:0 0 0 1.5px var(--key)}
.gold input[type=range]::-webkit-slider-runnable-track,.gold input[type=range]::-moz-range-track{background:linear-gradient(to right,var(--gold) calc(10px + (100% - 20px)*var(--r)),var(--line) 0)}
.gold input[type=range]::-webkit-slider-thumb{background:var(--gold);box-shadow:0 0 0 1.5px var(--gold),0 2px 6px rgba(0,0,0,.3)}
.gold input[type=range]::-moz-range-thumb{background:var(--gold);box-shadow:0 0 0 1.5px var(--gold)}
.ticks{position:relative;height:26px}
.ticks button{position:absolute;top:2px;left:calc(10px + (100% - 20px)*var(--r));transform:translateX(-50%);border:0;background:transparent;padding:0 2px;font-size:11px;line-height:1.6;color:var(--mute);font-variant-numeric:tabular-nums}
.ticks button:hover{color:var(--ink)}
.ticks button.on{color:var(--key);font-weight:700}
.ticks .y2{display:none}
.mt{height:8px}
.mt i{position:absolute;top:0;width:1px;height:7px;background:var(--line);left:calc(10px + (100% - 20px)*var(--r))}
.mt i.on{background:var(--gold);width:2px}
.bands{display:flex;gap:2px;height:24px}
.bands button{min-width:0;overflow:hidden;white-space:nowrap;border:0;border-radius:6px;font-size:10.5px;line-height:24px;padding:0 2px;text-align:center;color:var(--ink);background:hsl(var(--h) 55% 50% / .22)}
.bands button:hover{background:hsl(var(--h) 55% 50% / .4)}
.bands button.on{background:hsl(var(--h) 55% 50% / .45);font-weight:700}
details.all{margin-top:14px}
details.all summary{cursor:pointer;font-size:13px;color:var(--mute);margin-bottom:10px}
.infocol{display:flex;flex-direction:column;gap:12px;min-width:0}
.period h3{font:800 17px/1.5 var(--serif);margin:8px 0 6px}
.period p{font-size:14px;color:var(--mute);line-height:1.8}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h4{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.box h4 span{font-weight:400;color:var(--mute);font-size:12px}
details.trap{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;padding:0 12px}
details.trap summary{cursor:pointer;list-style:none;padding:8px 0;font:600 14px/1.6 var(--sans);display:flex;gap:8px;justify-content:space-between;align-items:baseline}
details.trap summary::-webkit-details-marker{display:none}
details.trap[open] summary{border-bottom:1px dashed var(--line)}
details.trap .ans{padding:8px 0 10px;font-size:14px;line-height:1.75}
.checks li{display:flex;gap:8px;font-size:13.5px;line-height:1.7;padding:2px 0}
.checks li::before{content:"";flex:none;width:6px;height:6px;margin-top:.7em;border-radius:50%;background:var(--key)}

/* module 2 */
.eras{display:grid;gap:10px}
.mtl{margin-bottom:16px}
.era{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.era .lab{flex:none;width:9.5em;font-size:12px;color:var(--mute)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;font-size:13px;line-height:1.7}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.mcard{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:20px;background:var(--gold-soft);border-radius:14px;padding:20px}
.mcard .l{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mcard h3{font:800 22px/1.4 var(--serif)}
.mcard .mn{font:800 17px/1.6 var(--serif);color:var(--key);background:var(--surface);border-radius:10px;padding:8px 14px}
.mcard .r{display:flex;flex-direction:column;gap:12px;min-width:0}
.mcard .lab{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.08em}
.mcard p{font-size:15.5px;line-height:1.9}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:auto}
.mrow .cnt{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-left:auto}

/* module 3 */
.deck{max-width:720px;margin:0 auto}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:500;color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fl{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;margin-bottom:10px}
.fl .lab{font-size:12px;color:var(--mute);min-width:2.6em;letter-spacing:.08em}
.prog{display:flex;align-items:center;gap:10px;margin:14px 0 10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:20px 18px 18px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:14px;letter-spacing:.04em}
.q{font:600 19px/1.8 var(--serif);margin:0 0 16px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.6}
.opt .l{flex:none;width:1.7em;height:1.7em;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);margin-top:.1em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
.jd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jd .opt{justify-content:center;align-items:center;font-weight:700;font-size:17px;padding:14px}
.blank{font:inherit;font-weight:700;color:var(--accent);background:var(--accent-soft);border:0;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;padding:0 4px;margin:0 3px;text-align:center;min-width:3em;max-width:100%}
.blank:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft),0 2px 0 var(--accent)}
.fr{display:inline-block;border-radius:6px;padding:0 7px;margin:0 3px;font-weight:700;line-height:1.5}
.fr.ok{background:var(--ok-soft);color:var(--ok)}
.fr.bad{background:var(--bad-soft);color:var(--bad)}
.fr.bad s{opacity:.7}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.fb{margin-top:16px;border-radius:12px;padding:12px 14px;background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fbh{font-weight:800;margin-bottom:2px;color:var(--ok)}
.fb.bad .fbh{color:var(--bad)}
.fb p{font-size:15px}
.cue{font:800 26px/1.5 var(--serif);color:var(--key);text-align:center;padding:22px 8px;border-radius:12px;background:var(--key-soft);margin:0 0 4px;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--mute);text-align:center;margin:8px 0 0}
.mean{font:500 17px/1.8 var(--serif);margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.self{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.grp{margin:0 0 18px}
.grp h2{font:800 16px/1.4 var(--serif);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.grp h2 span{font:400 12px var(--sans);color:var(--mute)}
details.mnd{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:0 14px}
details.mnd summary{cursor:pointer;padding:11px 0;font:700 16px/1.6 var(--serif);color:var(--key);list-style:none;overflow-wrap:anywhere}
details.mnd summary::-webkit-details-marker{display:none}
details.mnd[open] summary{border-bottom:1px dashed var(--line)}
details.mnd .mn{padding:10px 0 12px;font-size:15px}
details.mnd .kp{font-size:12px;color:var(--mute);display:block;margin-top:4px}
.wl{display:grid;gap:8px;margin-bottom:14px}
.wi{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;overflow-wrap:anywhere}
.wi small{display:block;color:var(--mute);font-size:12px}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ik{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:8px;align-items:baseline;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.ik:hover{border-color:var(--accent)}
.ik .kn{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.ik .kt{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.ik .kc{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.foot{margin-top:24px;text-align:center}

@media (max-width:860px){
  .mapgrid,.mcard{grid-template-columns:minmax(0,1fr)}
  #map{height:340px}
  .era .lab{width:100%}
  .ticks .y4{display:none}
  .ticks .y2{display:inline}
  .stat{display:none}
  .jump{order:3;width:100%;justify-content:space-between}
  .jump button{flex:1}
}
@media (max-width:480px){
  .panel{padding:16px 14px}
  .now{margin-left:0}
  .q{font-size:18px}
  .sub{display:none}
  .seal{width:32px;height:32px;font-size:17px}
  h1{font-size:16px}
  .top-in{padding-block:8px;gap:6px}
  .jump button{padding:3px 10px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
/* required styles */
.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,

function statHTML(){

function metaHTML(c){return '<div class="meta"><span>'+c.ch+' · 知识点 '+pad(c.k)+' '+esc(TITLES[c.k]||"")+'</span><span class="tag'+(c.t==="m"?" m":"")+'">'+TN[c.t]+'</span></div>';}
function fbHTML(extra){
  var c=cur.c,h='<div class="fb'+(cur.ok?"":" bad")+'"><div class="fbh">'+(cur.ok?"✓ 答对了":"✗ 答错了")+'</div>';

  if(c.e)h+='<p>'+fmt(c.e)+'</p>';
  h+='</div><div class="row">';
  if(c.t==="f"&&!cur.ok)h+='<button type="button" class="btn" data-a="fix">我其实答对了</button>';

function drillHTML(){
  if(!cur){return '<div class="card empty">'+(V.wrong?'没有错题了，很干净。':'没有符合条件的卡片。')+'<div class="row" style="justify-content:center"><button type="button" class="btn" data-a="clear">清除筛选</button></div></div>';}

  var h='<div class="prog"><span>第 '+(Q.p+1)+' / '+n+' 张</span><div class="bar"><i style="width:'+(n?Math.round(m/n*100):0)+'%"></i></div><span>本组掌握 '+m+'</span></div>';

  if(c.t==="c"){
    h+='<p class="q">'+fmt(c.q)+'</p><div class="opts">'+cur.order.map(function(oi,di){
      var cls="opt",dis="";
      if(cur.done){dis=" disabled";if(oi===c.a)cls+=" ok";else if(di===cur.sel)cls+=" bad";else cls+=" dim";}
      return '<button type="button" class="'+cls+'" data-a="opt" data-v="'+di+'"'+dis+'><span class="l">'+"ABCD"[di]+'</span><span>'+fmt(c.o[oi])+'</span></button>';
    }).join("")+'</div>';
    if(cur.done)h+=fbHTML(cur.ok?"":"正确答案：<b class=\"k\">"+esc(c.o[c.a])+"</b>");
  }else if(c.t==="j"){
    h+='<p class="q">'+fmt(c.q)+'</p><div class="jd">';
    [[1,"✓ 正确"],[0,"✗ 错误"]].forEach(function(p){
      var cls="opt",dis="";
      if(cur.done){dis=" disabled";var right=(p[0]===1)===c.a;if(right)cls+=" ok";else if(cur.sel===p[0])cls+=" bad";else cls+=" dim";}
      h+='<button type="button" class="'+cls+'" data-a="judge" data-v="'+p[0]+'"'+dis+'>'+p[1]+'</button>';
    });
    h+='</div>';
    if(cur.done)h+=fbHTML(cur.ok?"":"这句话是"+(c.a?"<b class=\"k\">正确</b>":"<b class=\"k\">错误</b>")+"的。");
  }else if(c.t==="f"){
    var parts=c.q.split(/＿+/),q="";
    parts.forEach(function(p,i){
      q+=fmt(p);
      if(i<parts.length-1){
        var alts=[].concat(c.a[i]);
        if(!cur.done){
          var w=Math.max.apply(null,alts.map(function(x){return x.length;}));
          q+='<input class="blank" id="b'+i+'" data-i="'+i+'" style="width:'+Math.max(3.4,w*1.3+1.2)+'em" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第'+(i+1)+'空">';
        }else{
          var good=cur.res[i];
          q+=good?'<span class="fr ok">'+esc(alts[0])+'</span>':'<span class="fr bad">'+(cur.vals[i]?'<s>'+esc(cur.vals[i])+'</s> → ':'')+esc(alts[0])+'</span>';
        }
      }
    });

    else h+=fbHTML("");
  }else{
    h+='<p class="cue">'+fmt(c.q)+'</p>';
    if(!cur.flipped)h+='<p class="hint">先回想它对应什么，再翻开核对</p><div class="row" style="justify-content:center"><button type="button" class="btn p" data-a="flip">翻开</button></div>';

function mnemHTML(){
  var list=D.filter(function(c){return c.t==="m"&&(V.ch==="全部"||c.ch===V.ch);});

    var g=list.filter(function(c){return c.ch===ch;});

      return '<details class="mnd"><summary>'+fmt(c.q)+'</summary><div class="mn">'+fmt(c.a)+(c.e?'<br>'+fmt(c.e):'')+'<span class="kp">知识点 '+pad(c.k)+'</span></div></details>';
    }).join("")+'</div>';
  });

}
function wrongHTML(){
  var w=wrongList();

  return '<div class="wl">'+w.map(function(c){
    var q=c.q.replace(/\*\*/g,"").replace(/＿+/g,"＿＿");
    return '<div class="wi"><small>'+c.ch+' · 知识点 '+pad(c.k)+' · '+TN[c.t]+'</small>'+esc(q)+'</div>';

function ktitle(g){

}
function idxHTML(){
  var h='<p class="hint" style="margin:0 0 12px;text-align:left">手册 001–100 全部知识点，点任一条只练它的题。右侧是已掌握 / 总卡数。</p>';

function topOffset(){var t=$(".top");return (t?t.getBoundingClientRect().height:0)+8;}
function keepInView(){
  var el=$("#sec-drill"),r=el.getBoundingClientRect(),off=topOffset();
  if(r.top<off-1||r.top>window.innerHeight*.6)window.scrollTo({top:window.scrollY+r.top-off});

function collect(){
  var c=cur.c,vals=[],res=[];
  c.a.forEach(function(a,i){var el=$("#b"+i);var v=el?el.value.trim():"";vals.push(v);res.push(okFill(v,a));});
  cur.vals=vals;cur.res=res;

}
$("#sec-drill").addEventListener("click",function(e){
  var t=e.target.closest("[data-tab],[data-f],[data-a]");if(!t)return;
  if(t.dataset.tab){V.tab=t.dataset.tab;if(V.tab==="drill"&&Q.sig!==sig())refresh();else render();return;}
  if(t.dataset.f){
    var k=t.dataset.f,v=t.dataset.v;
    if(k==="wrong")V.wrong=!V.wrong;else V[k]=v;
    save();if(V.tab==="drill")refresh();else render();return;
  }
  var a=t.dataset.a,v2=t.dataset.v,move=false;
  if(a==="opt"&&!cur.done){cur.sel=+v2;grade(cur.order[cur.sel]===cur.c.a);render();}
  else if(a==="judge"&&!cur.done){cur.sel=+v2;grade((+v2===1)===cur.c.a);render();}
  else if(a==="submit"&&!cur.done){var ok=collect();grade(ok);render();}
  else if(a==="give"&&!cur.done){collect();cur.res=cur.res.map(function(){return false;});grade(false);render();}
  else if(a==="fix"){try{if(cur.prev==="null")delete S[cur.c.id];else S[cur.c.id]=JSON.parse(cur.prev);}catch(x){}cur.res=cur.res.map(function(){return true;});grade(true);render();}
  else if(a==="flip"){cur.flipped=true;render();}
  else if(a==="self"){
    var s=S[cur.c.id]||(S[cur.c.id]={b:0,w:0,n:0});s.n++;
    if(v2==="2"){s.b=Math.min(3,s.b+1);s.w=0;}else if(v2==="1"){s.w=0;}else{s.b=0;s.w=1;}
    save();next();render();move=true;
  }
  else if(a==="next"){next();render();move=true;}
  else if(a==="clear"){V.ch="全部";V.ty="全部";V.wrong=false;V.k=null;V.kw=null;save();refresh();}
  else if(a==="clrscope"){V.k=null;V.kw=null;refresh();}
  else if(a==="pickk"){V.k=+v2;V.kw=null;V.tab="drill";V.ch="全部";V.ty="全部";V.wrong=false;refresh();move=true;}
  else if(a==="rewrong"){V.tab="drill";V.ch="全部";V.ty="全部";V.wrong=true;V.k=null;V.kw=null;refresh();move=true;}
  if(move)keepInView();
});
function typing(e){var t=e.target;return t&&t.matches&&t.matches("input:not(.blank),textarea,select");}
function deckVisible(){var r=$("#sec-drill").getBoundingClientRect();return r.top<window.innerHeight*.7&&r.bottom>120;}
document.addEventListener("keydown",function(e){
  if(V.tab!=="drill"||!cur||typing(e)||e.metaKey||e.ctrlKey||e.altKey||!deckVisible())return;
  var c=cur.c;
  if(e.key==="Enter"){
    if(cur.done){next();render();keepInView();e.preventDefault();}
    else if(c.t==="f"&&e.target.classList&&e.target.classList.contains("blank")){
      var i=+e.target.dataset.i,nx=$("#b"+(i+1));
      if(nx){nx.focus();}else{grade(collect());render();}

    cur.sel=e.key==="1"?1:0;grade((cur.sel===1)===c.a);render();
  }
});

function placeBubble(tl,bb,r,text){
  bb.textContent=text;tl.style.setProperty("--r",r);
  var W=tl.clientWidth,w=bb.offsetWidth,x=10+(W-20)*r;
  x=Math.max(w/2,Math.min(W-w/2,x));bb.style.left=(x-w/2)+"px";
}
window.placeBubble=placeBubble;
var STAGE_CLS={"旧民主主义革命":"","新民主主义革命":"m","社会主义革命与建设":"g"};

/* 地图：只用内嵌的省界，不依赖在线瓦片 */
var map=L.map("map",{zoomControl:false,attributionControl:false,minZoom:3,maxZoom:8,zoomSnap:.25,zoomDelta:.5,maxBounds:[[2,62],[60,150]],maxBoundsViscosity:.6});
L.control.zoom({position:"topright"}).addTo(map);
var provs={};
Object.keys(GEO).forEach(function(name){
  var g=GEO[name],ll=g.p.map(function(r){return r.map(function(p){return [p[1],p[0]];});});
  var poly=L.polygon(ll,{className:"prov",interactive:true}).addTo(map);
  poly.bindTooltip(name,{sticky:true,className:"ptip",direction:"top"});
  provs[name]=poly;
  if(g.c&&name!=="香港"&&name!=="澳门"&&name!=="天津"&&name!=="上海"&&name!=="北京"){
    L.marker([g.c[1],g.c[0]],{interactive:false,keyboard:false,icon:L.divIcon({className:"plabel",html:name,iconSize:[0,0]})}).addTo(map);
  }
});
var ALL=[[18,73],[53.6,135.2]];
function chinaView(anim){map.fitBounds(ALL,{padding:[8,8],animate:!!anim&&!reduce});}
chinaView(false);
function zc(){$("#map").classList.toggle("z5",map.getZoom()>=4.75);}
map.on("zoomend",zc);zc();
$("#mapReset").addEventListener("click",function(){chinaView(true);});

var pins=[],routeLine=null,idx=0;
function setHi(names){
  Object.keys(provs).forEach(function(n){var el=provs[n].getElement();if(el)el.classList.toggle("hi",names.indexOf(n)>=0);});
}
function render(i,first){
  idx=i;var d=H[i];
  pins.forEach(function(m){map.removeLayer(m);});pins=[];
  if(routeLine){map.removeLayer(routeLine);routeLine=null;}
  setHi(d.prov);
  var pts=[];
  d.markers.forEach(function(mk,n){
    var ic=L.divIcon({className:"pin",html:'<span style="background:'+mk.color+'">'+(n+1)+'</span>',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-12]});
    var m=L.marker([mk.lat,mk.lng],{icon:ic,title:mk.name,riseOnHover:true}).addTo(map);
    m.bindPopup("<b>"+esc(mk.name)+"</b>");
    pins.push(m);pts.push([mk.lat,mk.lng]);
  });
  if(d.route){
    routeLine=L.polyline(d.route.map(function(n){return pts[n];}),{className:"route",interactive:false}).addTo(map);
  }
  var b=L.latLngBounds(pts);
  var opt={paddingTopLeft:[40,64],paddingBottomRight:[40,48],maxZoom:6.5};
  if(first||reduce)map.fitBounds(b,Object.assign({animate:false},opt));
  else map.flyToBounds(b,Object.assign({duration:.9},opt));

  $("#now").textContent=d.year+" · "+d.short;
  $("#mapTitle").textContent=d.year+"年 · "+d.short;
  var st=$("#pStage");st.textContent=d.stage;st.className="tag "+(STAGE_CLS[d.stage]||"");
  $("#pTitle").textContent=d.year+"年　"+d.title;
  $("#pDesc").textContent=d.desc;
  $("#places").innerHTML=d.markers.map(function(mk,n){
    return '<li><button type="button" data-p="'+n+'"><i style="background:'+mk.color+'">'+(n+1)+'</i>'+esc(mk.name.split("：")[0])+'</button></li>';
  }).join("");
  $("#traps").innerHTML=d.traps.map(function(t){
    return '<details class="trap"><summary><span>'+esc(t.q)+'</span><span class="tag g">'+esc(t.tag)+'</span></summary><div class="ans">'+fmt(t.a)+'</div></details>';
  }).join("");
  $("#checks").innerHTML=d.checks.map(function(c){return "<li><span>"+esc(c)+"</span></li>";}).join("");
  var n=window.countKw?window.countKw(d.kw):0;
  var pd=$("#pDrill");pd.textContent="练本时期的题"+(n?"（"+n+" 张）":"");pd.disabled=!n;
  Array.prototype.forEach.call($("#rail").children,function(btn,k){
    btn.classList.toggle("on",k===i);btn.classList.toggle("past",k<i);btn.setAttribute("aria-current",k===i?"step":"false");
  });
  placeBubble($("#pTl"),$("#pBubble"),i/(H.length-1),d.year+" "+d.short);$("#pRange").value=i;
  $("#pPrev").disabled=i===0;$("#pNext").disabled=i===H.length-1;
}
$("#rail").innerHTML=H.map(function(d,i){return '<button type="button" data-i="'+i+'" style="--r:'+(i/(H.length-1))+'" aria-label="'+d.year+' '+esc(d.short)+'"><span class="y4">'+d.year+'</span><span class="y2">\u2019'+d.year.slice(2)+'</span></button>';}).join("");
$("#pRange").addEventListener("input",function(e){var v=+e.target.value;if(v!==idx)render(v);});
$("#rail").addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)render(+b.dataset.i);});
$("#pPrev").addEventListener("click",function(){if(idx>0)render(idx-1);});
$("#pNext").addEventListener("click",function(){if(idx<H.length-1)render(idx+1);});
$("#places").addEventListener("click",function(e){
  var b=e.target.closest("[data-p]");if(!b)return;
  var m=pins[+b.dataset.p],ll=m.getLatLng();
  map.flyTo(ll,Math.max(map.getZoom(),6),{duration:reduce?0:.7});m.openPopup();
});
$("#pDrill").addEventListener("click",function(){var d=H[idx];window.openDrill(d.kw,d.short);});
document.querySelector(".jump").addEventListener("click",function(e){
  var b=e.target.closest("[data-go]");if(!b)return;
  var el=document.getElementById(b.dataset.go);if(el)el.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
});
function setTop(){var h=document.querySelector(".top");if(h)document.documentElement.style.setProperty("--topH",(h.getBoundingClientRect().height+8)+"px");}
setTop();window.addEventListener("resize",setTop);
render(0,true);
setTimeout(function(){map.invalidateSize();render(idx,true);},300);
})();
</script>

 {n:"十八届三中全会",y:"2013",mn:"十八三中破冰",e:E7,kw:"十八届三中|十八三中",d:"改革由局部探索、破冰突围到系统集成、全面深化；总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。"},
 {n:"二十届三中全会",y:"2024",mn:"二十届三中续深改",e:E7,kw:"二十届三中",d:"重点部署进一步全面深化改革，推进中国式现代化。"}
];
var eras=[E1,E2,E3,E4,E5,E6,E7],cur=0,N=M.length;
var ESH={};ESH[E1]="大革命";ESH[E2]="土地革命";ESH[E3]="抗战";ESH[E4]="解放";ESH[E5]="建设";ESH[E6]="改革开放";ESH[E7]="新时代";
var EH=[210,25,140,350,45,265,185];
$("#mTicks").innerHTML=M.map(function(m,i){return '<i style="--r:'+(i/(N-1))+'"></i>';}).join("");
var bandsEl=$("#mBands");
bandsEl.style.margin="0 calc(10px - (100% - 20px) / "+(2*(N-1))+")";
bandsEl.innerHTML=eras.map(function(e,k){
  var cnt=M.filter(function(m){return m.e===e;}).length,first=M.findIndex(function(m){return m.e===e;});
  return '<button type="button" data-first="'+first+'" data-e="'+e+'" title="'+e+'" style="flex:'+cnt+' 1 0;--h:'+EH[k]+'">'+ESH[e]+'</button>';
}).join("");
bandsEl.addEventListener("click",function(ev){var b=ev.target.closest("[data-first]");if(b)render(+b.dataset.first);});
$("#mRange").addEventListener("input",function(ev){var v=+ev.target.value;if(v!==cur)render(v);});
$("#eras").innerHTML=eras.map(function(e){
  return '<div class="era"><span class="lab">'+e+'</span>'+M.map(function(m,i){return m.e===e?'<button type="button" class="chip" data-m="'+i+'" aria-pressed="false">'+esc(m.n)+'</button>':"";}).join("")+'</div>';
}).join("");
function render(i){
  cur=i;var m=M[i];
  $("#meetNow").textContent=m.n+" · "+m.y;
  $("#mName").textContent=m.n+"（"+m.y+"）";
  $("#mMn").textContent="口诀："+m.mn;
  $("#mDesc").textContent=m.d;
  $("#mEra").textContent=m.e;
  $("#mCnt").textContent=(i+1)+" / "+M.length;
  $("#mRange").value=i;
  window.placeBubble($("#mTl"),$("#mBubble"),i/(N-1),m.n+" "+m.y);
  Array.prototype.forEach.call(document.querySelectorAll("#mTicks i"),function(x,k){x.classList.toggle("on",k===i);});
  Array.prototype.forEach.call(document.querySelectorAll("#mBands button"),function(x){x.classList.toggle("on",x.dataset.e===m.e);});
  var n=window.countKw?window.countKw(m.kw):0;
  var b=$("#mDrill");b.textContent="练这个会议的题"+(n?"（"+n+" 张）":"");b.disabled=!n;
  $("#mPrev").disabled=i===0;$("#mNext").disabled=i===M.length-1;
  Array.prototype.forEach.call(document.querySelectorAll("#eras .chip"),function(c){c.setAttribute("aria-pressed",String(+c.dataset.m===i));});
}
$("#eras").addEventListener("click",function(e){var b=e.target.closest("[data-m]");if(b)render(+b.dataset.m);});
$("#mPrev").addEventListener("click",function(){if(cur>0)render(cur-1);});
$("#mNext").addEventListener("click",function(){if(cur<M.length-1)render(cur+1);});
$("#mDrill").addEventListener("click",function(){var m=M[cur];window.openDrill(m.kw,m.n);});
render(0);
})();
</script>
