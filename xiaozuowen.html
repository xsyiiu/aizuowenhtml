<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>考研英语小作文 · 交互模板 v1.0.0</title>
<link rel="manifest" href="manifest-xzw.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --card2:#f1ede4; --line:#e3ddd1; --line2:#cdc4b5;
  --fg:#20242b; --dim:#5b6472; --dim2:#8b929d;
  --accent:#b25f16; --accent-bg:rgba(178,95,22,.10);
  --blue:#2c66c4; --blue-bg:rgba(44,102,196,.10);
  --ok:#1c8a5f; --danger:#c0392b;
  --radius:14px; --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 18% -12%,#fffdf7 0%,transparent 62%),var(--bg);
  color:var(--fg); font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:90px; overflow-x:hidden;
}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 40px}
header.top{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(253,251,246,.92);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:8px 14px}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#d4822a,#a9550f);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;box-shadow:0 4px 14px rgba(150,80,20,.18)}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:11px;color:var(--dim2)}
.ver{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-radius:99px;font-size:10px;color:var(--accent);background:var(--accent-bg)}
.bar-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--fg);padding:7px 11px;border-radius:10px;font-size:13px;
  transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:#f4efe6}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(145deg,#c4711f,#a75712);color:#fff;border:none;font-weight:700;box-shadow:0 3px 10px rgba(150,80,20,.18)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.row2{display:flex;gap:10px;align-items:flex-start;margin-top:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:1 1 420px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:99px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.chip.on{background:var(--accent-bg);border-color:rgba(178,95,22,.45);color:var(--accent);font-weight:600}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.sel{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;max-width:230px}
.sw{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);border:1px solid var(--line);
  padding:5px 9px;border-radius:99px;background:var(--card);user-select:none}
.sw input{accent-color:var(--accent);margin:0}
.sw.on{color:var(--fg);border-color:rgba(178,95,22,.45)}
.layout{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media(min-width:1000px){.layout{grid-template-columns:300px minmax(0,1fr)} .side{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.side h3,.ptitle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin:0 0 10px}
.field{margin-bottom:9px}
.field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.field input,.field select{width:100%;background:#fffdfa;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.field .hint{font-size:10.5px;color:var(--dim2);margin-top:2px}
.side-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:#f7f3ea;border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:none;background:transparent;color:var(--dim);padding:5px 4px;border-radius:6px;font-size:12px}
.seg button.on{background:var(--card2);color:var(--fg);font-weight:600}
preview{display:block}
.pblock{background:linear-gradient(180deg,#ffffff,#fdfaf4);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(60,45,20,.04);padding:14px 14px 6px;margin-bottom:14px}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pnum{width:24px;height:24px;border-radius:8px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.phead h2{font-size:14px;margin:0;font-weight:700}
.phead .tag{font-size:10.5px;color:var(--dim2);border:1px solid var(--line);padding:1px 6px;border-radius:99px}
.phead .tools{margin-left:auto;display:flex;gap:6px}
.mini{border:1px solid var(--line);background:transparent;color:var(--dim);font-size:11px;padding:3px 8px;border-radius:8px}
.mini:hover{color:var(--fg);border-color:var(--line2)}
.sent{border-top:1px dashed var(--line);padding:11px 0}
.sent:first-of-type{border-top:none}
.sent-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sent-label{font-size:11.5px;color:var(--accent);font-weight:600;letter-spacing:.02em}
.sent-sel{flex:1 1 160px;min-width:120px;background:#fffdfa;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:11.5px;color:var(--dim)}
.sent-sel:hover{color:var(--fg)}
.en{font-family:var(--serif);font-size:17.5px;line-height:1.75;letter-spacing:.1px;color:#1c2128;word-break:break-word}
@media(max-width:600px){.en{font-size:16px;line-height:1.7}}
.zh{font-size:12.5px;line-height:1.7;color:var(--dim);margin-top:5px;padding-left:9px;border-left:2px solid var(--line2)}
.note{font-size:11.5px;color:#8a5a12;background:rgba(178,95,22,.06);border:1px solid rgba(178,95,22,.18);
  border-radius:8px;padding:5px 8px;margin-top:6px;line-height:1.6}
.note b{color:var(--accent)}
.slot{display:inline;border:none;background:var(--accent-bg);color:var(--accent);border-radius:6px;padding:1px 5px;
  margin:0 1px;font:inherit;font-family:var(--serif);border-bottom:1px dashed rgba(178,95,22,.45);line-height:1.5;transition:.12s}
.slot:hover{background:rgba(178,95,22,.15)}
.slot.filled{background:var(--blue-bg);color:#1f4f9e;border-bottom-color:rgba(44,102,196,.45)}
.slot.filled:hover{background:rgba(44,102,196,.18)}
.slot.empty{color:#96661c;opacity:1}
.slot.flash{outline:2px solid var(--accent);outline-offset:1px}
.slotdemo{background:var(--blue-bg);color:#1f4f9e;border-bottom:1px dashed rgba(44,102,196,.45);border-radius:6px;padding:1px 5px}
.hintbar{font-size:12px;color:var(--dim);background:rgba(44,102,196,.05);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;margin-top:12px;line-height:1.7}
.fmtline{font-family:var(--serif);font-size:16.5px;line-height:1.95;color:#1c2128;margin:2px 0}
.fmtline.big{font-size:20px;font-weight:700;letter-spacing:.12em;text-align:center;margin:10px 0 12px}
.fmtline.big:first-child{margin-top:0}
.fmtlabel{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:11.5px;color:var(--dim);letter-spacing:.03em}
.empty-hint{text-align:center;color:var(--dim2);font-size:13px;padding:26px 10px}
/* modal */
#modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(48,42,32,.42);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.sheet{width:100%;max-width:720px;max-height:86vh;background:#fffdfa;border:1px solid var(--line2);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(60,45,20,.18);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:760px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-head h4{margin:0;font-size:14px}
.sheet-head .sub{font-size:11px;color:var(--dim2);margin-left:auto}
.sheet-body{overflow:auto;padding:10px 12px 4px;flex:1}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:10px;
  padding:8px 10px;margin-bottom:7px;transition:.12s}
.opt:hover{border-color:var(--line2);background:#f6f1e8}
.opt.cur{border-color:var(--accent);background:var(--accent-bg)}
.opt .oe{font-family:var(--serif);font-size:14.5px;color:#1f2328;line-height:1.5}
.opt .oz{font-size:11.5px;color:var(--dim);margin-top:2px}
.opt .onote{font-size:10.5px;color:#8a5a12;margin-top:2px}
.sheet-foot{padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sheet-foot input[type=text]{flex:1 1 180px;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.sheet-foot input[type=text]:focus{outline:none;border-color:var(--accent)}
.numtoggle{display:flex;gap:2px;background:#f7f3ea;border:1px solid var(--line);border-radius:9px;padding:2px}
.numtoggle button{border:none;background:transparent;color:var(--dim2);padding:5px 8px;border-radius:6px;font-size:11px}
.numtoggle button.on{background:var(--card2);color:var(--fg)}
#snapPanel{position:fixed;right:12px;top:112px;z-index:150;width:min(360px,calc(100vw - 24px));background:#fffdfa;
  border:1px solid var(--line2);border-radius:14px;padding:10px;display:none;box-shadow:0 14px 40px rgba(60,45,20,.16)}
#snapPanel.on{display:block}
.snap{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 8px;margin-bottom:6px;font-size:11.5px}
.snap b{font-size:12px}
.snap button{margin-left:auto}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:300;opacity:0;transition:.22s;
  background:#2b3038;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#updateBar{display:none;background:linear-gradient(90deg,#fff3d4,#ffe9bd);border-bottom:1px solid #e6c98d;color:#7a4a06;
  font-size:12.5px;padding:7px 14px;text-align:center}
#updateBar.on{display:block}
#updateBar b{color:#8a5209}
.foot{margin-top:18px;color:var(--dim2);font-size:11px;line-height:1.8;text-align:center}
.foot a{color:var(--dim)}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim2);margin-top:8px}
.stats b{color:var(--accent);font-weight:700}
.warn{color:#9a5a00;font-size:11px;margin-top:6px;display:none}
.warn.on{display:block}
</style>
</head>
<body>
<div id="updateBar">发现新版本 <b id="newVer">—</b>，当前显示的是旧缓存。<button class="mini" id="btnReload" style="margin-left:8px">立即刷新</button></div>
<header class="top">
  <div class="bar">
    <div class="row1">
      <div class="brand">
        <div class="logo">小</div>
        <div>
          <h1>考研英语小作文 · 交互模板</h1>
          <p>27版讲义全量拆解 · <span class="ver" id="verChip">v1.0.0</span> · 书信 / 通知 / 纪要</p>
        </div>
      </div>
      <div class="bar-actions">
        <button class="btn ghost" id="btnUndo" title="撤销">↶ 撤销</button>
        <button class="btn ghost" id="btnRedo" title="重做">↷ 重做</button>
        <button class="btn ghost" id="btnSnap">快照</button>
        <button class="btn ghost danger" id="btnClear">清空</button>
        <button class="btn primary" id="btnCopyAll">复制全文</button>
      </div>
    </div>
    <div class="row2">
      <div class="chips" id="typeChips"></div>
      <div class="controls">
        <select class="sel" id="presetSel" title="真题预设"></select>
        <label class="sw on"><input type="checkbox" id="tgZh" checked><span>中英对照</span></label>
        <label class="sw"><input type="checkbox" id="tgLite"><span>考场精简</span></label>
        <label class="sw on"><input type="checkbox" id="tgNote" checked><span>注释</span></label>
        <label class="sw on"><input type="checkbox" id="tgGram" checked><span>自动语法</span></label>
      </div>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="hintbar">用法：先选题型（回复信 / 主动信 / 公务信 / 通知 / 纪要）→ 填题干词 → 点<span class="slotdemo">彩色短语</span>换句。称呼和落款是格式行，也能点。</div>
  <div class="layout">
    <aside class="side">
      <div class="card">
        <h3>题干词 · 快速填写</h3>
        <div class="seg" id="sideSeg">
          <button data-tab="core" class="on">核心</button>
          <button data-tab="data">时间地点</button>
          <button data-tab="arg">结尾</button>
        </div>
        <div id="slotForm"></div>
        <div class="field">
          <label>分点连接词方案</label>
          <select id="connSel"></select>
        </div>
        <div class="side-actions">
          <button class="btn ghost" id="btnCopyP1" style="flex:1">复制第一段</button>
          <button class="btn ghost" id="btnCopyP2" style="flex:1">复制第二段</button>
        </div>
        <div class="warn" id="verWarn"></div>
      </div>
    </aside>
    <section id="preview"></section>
  </div>
  <div class="foot">
    <div>版本 <b id="footVer">v1.0.0</b> · 构建 2026-11-03 · 数据仅存本机浏览器（localStorage）</div>
    <div>讲义来源：《27考研英语小作文模板（英一英二通用）》 · 交互层为自制，例句均按原文收录</div>
    <div style="margin-top:6px"><button class="mini" id="btnForce">强制刷新（清缓存取新版）</button> · <a href="./" style="color:var(--dim)">← 回到大作文</a></div>
  </div>
</main>
<div id="snapPanel"></div>
<div id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h4 id="mTitle">选择短语</h4>
      <span class="sub" id="mSub"></span>
      <button class="mini" id="mClose">关闭</button>
    </div>
    <div class="sheet-body" id="mBody"></div>
    <div class="sheet-foot">
      <input type="text" id="mInput" placeholder="也可手动输入…">
      <div class="numtoggle" id="mNum">
        <button data-num="sg" class="on">单数</button>
        <button data-num="pl">复数</button>
      </div>
      <button class="btn" id="mApply">应用</button>
      <button class="btn ghost danger" id="mClear">清除</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
/* ============ 版本 ============ */
const APP_VERSION = '1.0.0';
const BUILD_DATE  = '2026-11-03';

/* ============ 小作文词库 ============ */
const BANK = {};
function B(id,label,hint,opts){ BANK[id]={label:label,hint:hint,opts:opts}; }

B("salutation","称呼","按收信人身份选，书信第一行",[
  {en:"Dear Mr. Lee,",zh:"尊敬的李先生：",note:"只知道姓·男"},
  {en:"Dear Ms. Lee,",zh:"尊敬的李女士：",note:"只知道姓·女"},
  {en:"Dear Paul,",zh:"亲爱的保罗：",note:"只知道名"},
  {en:"Dear John,",zh:"亲爱的约翰：",note:"只知道名"},
  {en:"Dear Manager,",zh:"尊敬的经理：",note:"只知道职位"},
  {en:"Dear President,",zh:"尊敬的主席/校长：",note:"只知道职位"},
  {en:"Dear Editor,",zh:"尊敬的编辑：",note:"投书报社"},
  {en:"Dear Professor,",zh:"尊敬的教授：",note:"只知道职位"},
  {en:"Dear Professor Smith,",zh:"尊敬的史密斯教授：",note:"22英一原题"},
  {en:"Dear Sir or Madam,",zh:"尊敬的先生或女士：",note:"啥也不知道"},
  {en:"Dear Friends,",zh:"亲爱的朋友们：",note:"告示/群体"},
  {en:"Dear David,",zh:"亲爱的大卫：",note:"23英二原题"}
]);

B("event","事件/事由","题干里的那件事",[
  {en:"the innovative craft-making exhibition",zh:"创新手工艺展",note:"25英一"},
  {en:"the play based on a classic Chinese novel",zh:"改编自中国古典小说的话剧",note:"25英二"},
  {en:"the exhibition of Chinese family letters",zh:"中国家书展",note:"26英一"},
  {en:"the video of your family's trip in China",zh:"你家人中国行的视频",note:"26英二"},
  {en:"the art exhibition",zh:"艺术展",note:"23英二"},
  {en:"the International Innovation Contest",zh:"国际创新大赛",note:"22英一"},
  {en:"the campus food festival",zh:"校园美食节",note:"22英二"},
  {en:"the singing contest",zh:"歌唱比赛",note:"20英一"},
  {en:"the cultural exchange program",zh:"文化交流项目",note:"10英二"},
  {en:"the “Aiding Rural Primary School” project",zh:"帮扶乡村小学项目",note:"19英一"},
  {en:"the library service",zh:"图书馆服务",note:"07·建议信"}
]);

B("activity","活动名称","通知/邀请里反复出现",[
  {en:"the singing contest",zh:"歌唱比赛",note:"20英一"},
  {en:"the campus food festival",zh:"校园美食节",note:"22英二"},
  {en:"the innovative craft-making exhibition",zh:"创新手工艺展",note:"25英一"},
  {en:"the art exhibition",zh:"艺术展",note:"23英二"},
  {en:"the volunteer recruitment",zh:"志愿者招募",note:"23英一"},
  {en:"the international innovation contest",zh:"国际创新大赛",note:"22英一"},
  {en:"the English corner",zh:"英语角",note:"通用"},
  {en:"the career fair",zh:"招聘会",note:"通用"},
  {en:"the charity sale",zh:"慈善义卖",note:"通用"},
  {en:"the graduation ceremony",zh:"毕业典礼",note:"通用"}
]);

B("place","地点","活动/会议在哪办",[
  {en:"the student activity center",zh:"学生活动中心",note:"最常用"},
  {en:"the playground",zh:"操场",note:"20/22年"},
  {en:"the assembly hall",zh:"大礼堂",note:"20英一"},
  {en:"the library",zh:"图书馆",note:"07·建议信"},
  {en:"the conference center",zh:"会议中心",note:"通用"},
  {en:"the multimedia room",zh:"多媒体室",note:"通用"},
  {en:"the gymnasium",zh:"体育馆",note:"通用"},
  {en:"the dining hall",zh:"食堂",note:"美食节"},
  {en:"the online platform",zh:"线上平台",note:"线上活动"},
  {en:"A111, conference room",zh:"A111会议室",note:"纪要格式"}
]);

B("time","时间点","几点开始",[
  {en:"8:00 a.m.",zh:"上午8点",note:"上午场"},
  {en:"3:00 p.m.",zh:"下午3点",note:"下午场"},
  {en:"5:00 p.m.",zh:"下午5点",note:"傍晚场"},
  {en:"7:00 p.m.",zh:"晚上7点",note:"晚间场"},
  {en:"from 7:00 to 8:00 p.m.",zh:"晚上7点到8点",note:"时段"}
]);

B("date","日期","几月几号",[

function slotLabel(id){

  if(base !== id){
    var mark = id.slice(base.length) === "2" ? "②" : id.slice(base.length) === "3" ? "③" : "";
    if(BANK[base] && BANK[base].label) return BANK[base].label + mark;

  }
  return id;
}

  var arr = slotOpts(id);
  for(var i=0;i<arr.length;i++){ if(arr[i].en === en) return arr[i]; }
  for(var k in BANK){

function getSlot(id){ var s = state.slots[id]; return (s && typeof s.v === "string" && s.v.length) ? s : null; }
function setSlot(id, v, zh, num){
  if(!v){ delete state.slots[id]; return; }
  var o = findOpt(id, v);
  state.slots[id] = {v:v, zh:(zh || (o && o.zh) || zhFor(id, v)), num:(num || (o && o.num) || "")};
}
function autoText(id, mode){
  var style = CONN_STYLES[state.conn] || CONN_STYLES[0];
  var idx = {c1:0,c2:1,c3:2}[id];
  if(mode === "zh"){
    var map = ["首先，","其次，","最后，"];
    return style.c[idx] ? map[idx] : "";
  }
  return style.c[idx] || "";
}
function slotText(id, mode, depth){
  if(id === "c1" || id === "c2" || id === "c3") return autoText(id, mode);
  var st = getSlot(id);
  if(!st) return "【" + slotLabel(id) + "】";
  var raw = (mode === "zh") ? (st.zh || st.v) : st.v;
  if(raw.indexOf("{") >= 0 && (depth||0) < 4){
    var sub = segmentsOf(raw, mode, {nested:true, depth:(depth||0)+1});
    return sub.map(function(x){ return x.s; }).join("").replace(/\s+/g, " ");
  }
  return raw;
}

/* ============ 语法 ============ */
var VERB_PAIRS = {
  "is":"are","was":"were","has":"have","does":"do","plays":"play","accounts":"account","tops":"top",
  "shows":"show","provides":"provide","remains":"remain","offers":"offer","helps":"help","lies":"lie",
  "deserves":"deserve","allows":"allow","enables":"enable","brings":"bring","makes":"make"
};
var PLURAL_TO_SG = {};
Object.keys(VERB_PAIRS).forEach(function(k){ PLURAL_TO_SG[VERB_PAIRS[k]] = k; });
var BASE_TO_SG = {provide:"provides",offer:"offers",help:"helps",allow:"allows",enable:"enables",
  bring:"brings",make:"makes",improve:"improves",increase:"increases",remain:"remains"};
function toPluralVerb(v){ var low=v.toLowerCase(); return VERB_PAIRS[low] ? matchCase(v, VERB_PAIRS[low]) : v; }
function toSingularVerb(v){
  var low=v.toLowerCase();
  if(PLURAL_TO_SG[low]) return matchCase(v, PLURAL_TO_SG[low]);
  if(BASE_TO_SG[low]) return matchCase(v, BASE_TO_SG[low]);
  return v;
}
function matchCase(src,out){ return (src[0]===src[0].toUpperCase()) ? out.charAt(0).toUpperCase()+out.slice(1) : out; }

function applyAgreement(segs){
  for(var i=0;i<segs.length-1;i++){
    var a=segs[i], b=segs[i+1];
    if(a.t==="slot" && b.t==="text"){
      var m=b.s.match(/^(\s+)([A-Za-z]+)/);
      var prev=(i>0 && segs[i-1].t==="text")?segs[i-1].s:"";
      var aux=/\b(does|do|did|is|are|was|were|has|have|had|can|could|will|would|should|may|might|must)\s+$/i.test(prev);
      if(m && a.filled && !aux){
        var num=a.num || (getSlot(a.id)&&getSlot(a.id).num);
        var verb=m[2], nv=verb;
        if(num==="pl") nv=toPluralVerb(verb);
        else if(num==="sg") nv=toSingularVerb(verb);
        if(nv!==verb) b.s=m[1]+nv+b.s.slice(m[0].length);
      }
    }
    if(a.t==="text" && b.t==="slot" && b.filled){
      var tail=a.s.match(/\b(does|is|has|was)\s+$/);
      var n2=b.num || (getSlot(b.id)&&getSlot(b.id).num);
      if(tail && n2==="pl"){
        var rep={does:"do",is:"are",has:"have",was:"were"}[tail[1]];
        a.s=a.s.replace(/\b(does|is|has|was)(\s+)$/, rep+"$2");
      }
    }
  }
}
var LOWER_AFTER_COMMA = {the:1,a:1,an:1,this:1,these:1,those:1,it:1,they:1,we:1,people:1,many:1,most:1,
  some:1,such:1,there:1,for:1,not:1,in:1,on:1,at:1,if:1,students:1,participants:1,all:1,every:1,
  during:1,due:1,what:1,interesting:1,located:1,written:1,given:1,without:1,thanks:1,thank:1,
  please:1,no:1,to:1,our:1,your:1,my:1,his:1,her:1,their:1,as:1,with:1,by:1,after:1,before:1,
  when:1,where:1,which:1,who:1,that:1,while:1,although:1,though:1,compared:1,according:1,
  more:1,both:1,each:1,over:1,beyond:1,through:1,so:1,only:1,just:1,even:1,still:1,
  therefore:1,thus:1,besides:1,furthermore:1,meanwhile:1,instead:1,despite:1,because:1,since:1};
function applyCaps(segs){
  var cap=true;
  for(var i=0;i<segs.length;i++){
    var seg=segs[i];
    if(seg.t==="slot"){
      if(cap && seg.filled && seg.s.length) seg.s=seg.s.charAt(0).toUpperCase()+seg.s.slice(1);
      cap=false; continue;
    }
    var s=seg.s,out="";
    for(var j=0;j<s.length;j++){
      var ch=s[j];
      if(cap && /[A-Za-z]/.test(ch)){ out+=ch.toUpperCase(); cap=false; continue; }
      out+=ch;
      if(/[.!?]/.test(ch)){
        var nx=s[j+1];
        if(nx===undefined||nx===" "||nx==="\n") cap=true;
        if(nx!==undefined && /[0-9]/.test(nx)) cap=false;
      } else if(ch===":" && (s[j+1]===" "||s[j+1]===undefined)) cap=true;
    }
    seg.s=out;
  }

function applyCommaLower(segs){
  for(var i=0;i<segs.length;i++){
    if(segs[i].t!=="text") continue;
    segs[i].s=segs[i].s.replace(/,\s+([A-Z])([a-z]+)/g,function(m,a,rest){
      var w=(a+rest).toLowerCase(); return LOWER_AFTER_COMMA[w]?(", "+w):m;
    });
    if(!/,\s*$/.test(segs[i].s)) continue;
    var j=i+1;
    while(j<segs.length && segs[j].t==="text" && /^\s*$/.test(segs[j].s)) j++;
    if(j>=segs.length) continue;
    var seg=segs[j];
    if(seg.t==="slot" && seg.filled){
      seg.s=seg.s.replace(/^([A-Z])([a-z]+)/,function(m,a,rest){
        var w=(a+rest).toLowerCase(); return LOWER_AFTER_COMMA[w]?w:m;
      });
    }else if(seg.t==="text"){
      seg.s=seg.s.replace(/^(\s*)([A-Z])([a-z]+)/,function(m,sp,a,rest){
        var w=(a+rest).toLowerCase(); return LOWER_AFTER_COMMA[w]?(sp+w):m;

function segmentsOf(tpl, mode, opts){

      var id=m[1];
      if(id==="c1"||id==="c2"||id==="c3"){
        var at=autoText(id,mode);
        if(at) out.push({t:"text",s:at});
        continue;
      }
      var st=getSlot(id);
      var txt=st?slotText(id,mode,depth):"【"+slotLabel(id)+"】";
      out.push({t:"slot",id:id,s:txt,filled:!!st,num:(st&&st.num)||""});
    }else{
      out.push({t:"text",s:part});
    }
  }
  if(state.toggles.gram){
    applyAgreement(out);
    if(!opts.nested) applyCaps(out);
    applyCommaLower(out);

  if(mode==="zh"){
    for(var z=0;z<out.length;z++){

    }

      if(out[z2].t==="text" && /^\s+$/.test(out[z2].s)){

        if(/[，。；：、！？]$/.test(pv)||/^[，。；：、！？]/.test(nx)) out[z2].s="";

  }
  for(var k=0;k<out.length;k++){
    if(out[k].t==="text") out[k].s=out[k].s.replace(/,\s*,/g,",").replace(/\s{2,}/g," ");

    var lastSeg = out[out.length-1], prevSeg = out[out.length-2];

function plainOf(segs){

}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ============ 组段 ============ */
function paragraphsOf(){
  var t=TYPE_MAP[state.type]||TYPES[0];
  var arr=clone(t.paras);
  if(state.toggles.lite){
    arr.forEach(function(p){ p.sents=p.sents.filter(function(s){ return !s.optional; }); });
  }
  return arr;
}
function variantOf(sent){
  var key=state.picks[sent.key];
  if(key === -1) return null;
  if(typeof key === "string"){
    for(var i=0;i<sent.vs.length;i++){ if(sent.vs[i].k===key) return sent.vs[i]; }
  }
  if(typeof key === "number" && sent.vs[key]) return sent.vs[key];
  return sent.vs[0];
}
function pickIndex(sent){
  var key=state.picks[sent.key];
  if(key === -1) return -1;
  if(typeof key === "string"){
    for(var i=0;i<sent.vs.length;i++){ if(sent.vs[i].k===key) return i; }
  }
  if(typeof key === "number" && sent.vs[key]) return key;
  return 0;
}
function connIndexFor(key){
  if(state.type === "minutes") return 0;
  if(key === "p2s2") return 1;
  if(key === "p2s3") return 2;
  if(key === "p2s4") return 3;
  return 0;
}

/* ============ 渲染 ============ */
function renderChips(){
  var box=document.getElementById("typeChips");
  box.innerHTML="";
  TYPES.forEach(function(t){
    var b=document.createElement("button");
    b.className="chip"+(t.id===state.type?" on":"");
    b.textContent=t.label;
    b.title=t.badge||"";
    b.onclick=function(){
      if(state.type===t.id) return;
      pushHistory(); state.type=t.id; state.picks={}; persist(); renderAll();
      toast("已切换到 "+t.label);
    };
    box.appendChild(b);
  });
}
function renderPresets(){
  var sel=document.getElementById("presetSel");
  var cur=sel.value;
  sel.innerHTML='<option value="">— 载入真题预设 —</option>';
  var groups={};
  PRESETS.forEach(function(p){
    var g=TYPE_MAP[p.type]?TYPE_MAP[p.type].group:"其他";
    if(!groups[g]){ groups[g]=document.createElement("optgroup"); groups[g].label=g; sel.appendChild(groups[g]); }
    var o=document.createElement("option"); o.value=p.id; o.textContent=p.name;
    groups[g].appendChild(o);
  });
  sel.value=cur||"";
  sel.onchange=function(){
    var p=null;
    PRESETS.forEach(function(x){ if(x.id===sel.value) p=x; });
    if(!p) return;
    snapshot("切换前 · "+(TYPE_MAP[state.type]?TYPE_MAP[state.type].label:""));
    pushHistory(); applyPreset(p); persist(); renderAll();
    toast("已载入："+p.name);
  };
}
function applyPreset(p){
  var s=emptyState();
  s.type=p.type;
  var merged={};
  for(var k in BASE) merged[k]=BASE[k];
  for(var k2 in p.slots) merged[k2]=p.slots[k2];
  for(var k3 in merged){
    var v=merged[k3];
    if(v===""||v===null||v===undefined) continue;
    var o=findOpt(k3,v);
    s.slots[k3]={v:v,zh:(o&&o.zh)||zhFor(k3,v),num:(o&&o.num)||""};
  }
  for(var k4 in p.picks) s.picks[k4]=p.picks[k4];
  state=s;
}
function renderSidebar(){
  var form=document.getElementById("slotForm");
  var tab=form.getAttribute("data-tab")||"core";
  var groups={
    core:[["salutation","称呼"],["event","事件/事由"],["activity","活动名称"]],
    data:[["place","地点"],["time","时间"],["date","日期"],["theme","主题"]],
    arg:[["intent","来信意图"],["purpose","目的"],["sign","署名"],["email","报名邮箱"]]
  };
  var list=groups[tab]||groups.core;
  var html="";
  list.forEach(function(pair){
    var id=pair[0], st=state.slots[id], val=st?st.v:"";
    html+='<div class="field"><label>'+esc(pair[1])+' <span style="color:var(--dim2)">'+esc(slotLabel(id))+'</span></label>'+
          '<input type="text" data-quick="'+id+'" value="'+esc(val)+'" placeholder="'+esc(slotLabel(id))+'">';
    if(BANK[id]&&BANK[id].hint) html+='<div class="hint">'+esc(BANK[id].hint)+'</div>';
    html+='</div>';
  });
  form.innerHTML=html;
  Array.prototype.forEach.call(form.querySelectorAll("input[data-quick]"),function(inp){
    inp.oninput=function(){
      var id=inp.getAttribute("data-quick"), v=inp.value.trim();
      if(v) setSlot(id,v,zhFor(id,v)); else delete state.slots[id];
      persist(); renderPreview();
    };
  });
  var seg=document.getElementById("sideSeg");
  Array.prototype.forEach.call(seg.querySelectorAll("button"),function(b){
    b.className=(b.getAttribute("data-tab")===tab)?"on":"";
  });
  var csel=document.getElementById("connSel");
  csel.innerHTML="";
  CONN_STYLES.forEach(function(c,i){
    var o=document.createElement("option"); o.value=i; o.textContent=c.name; csel.appendChild(o);
  });
  csel.value=state.conn;
  csel.onchange=function(){ pushHistory(); state.conn=parseInt(csel.value,10)||0; persist(); renderPreview(); };
}
function fmtSegments(fmt){
  var out=[];
  fmt.forEach(function(f){
    if(f.text){ out.push({t:"fmt", text:f.text, big:!!f.big}); return; }
    var segs=segmentsOf("{"+f.slot+"}", "en");
    var zhSegs=segmentsOf("{"+f.slot+"}", "zh");
    out.push({t:"fmtSlot", label:f.label||"", slot:f.slot, segs:segs, zhSegs:zhSegs, text:plainOf(segs)});
  });
  return out;
}
function fmtHTML(items){
  return items.map(function(it){
    if(it.t==="fmt") return '<div class="fmtline'+(it.big?" big":"")+'">'+esc(it.text)+'</div>';
    return '<div class="fmtline"><span class="fmtlabel">'+(it.label?esc(it.label)+": ":"")+'</span>'+htmlOf(it.segs)+'</div>';
  }).join("");
}
function fmtText(items){
  return items.map(function(it){
    return it.t==="fmt" ? it.text : ((it.label?it.label+": ":"")+it.text);
  }).join("\n");
}
function fmtZH(items){
  return items.map(function(it){
    return it.t==="fmt" ? it.text : ((it.label?it.label+": ":"")+plainOf(it.zhSegs));
  }).join("\n");
}

function renderPreview(){
  var box=document.getElementById("preview");
  var paras=paragraphsOf();
  var html="", totalWords=0, filled=0;
  for(var kk in state.slots){ if(state.slots[kk]&&state.slots[kk].v) filled++; }
  if(!filled){
    html+='<div class="hintbar" style="margin:0 0 12px">还没有填任何内容：先在上方选一个<b>真题预设</b>，或直接点下面的【标签】逐词填。</div>';
  }
  paras.forEach(function(p){
    var inner="", pWords=0;
    var fmtHTMLStr = (p.fmt && p.fmt.length) ? fmtHTML(fmtSegments(p.fmt)) : "";
    if(p.fmtPos !== "bottom") inner += fmtHTMLStr;
    p.sents.forEach(function(sent){
      var idx=pickIndex(sent), varnt=variantOf(sent);
      if(!varnt) return;
      var cidx=connIndexFor(sent.key);
      var tplEn = (cidx? "{c"+cidx+"} " : "") + varnt.en;
      var tplZh = (cidx? "{c"+cidx+"} " : "") + varnt.zh;
      var segsEn=segmentsOf(tplEn,"en"), segsZh=segmentsOf(tplZh,"zh");
      var en=plainOf(segsEn), zh=plainOf(segsZh);
      pWords+=en.split(/\s+/).filter(Boolean).length;
      var groupsSeen=[], optsHTML='<option value="-1"'+(idx===-1?" selected":"")+'>— 不写这一句 —</option>';
      sent.vs.forEach(function(v,i){
        if(v.g && groupsSeen.indexOf(v.g)<0){
          if(groupsSeen.length) optsHTML+='</optgroup>';
          optsHTML+='<optgroup label="'+esc(v.g)+'">'; groupsSeen.push(v.g);
        }
        optsHTML+='<option value="'+i+'"'+(i===idx?" selected":"")+'>'+esc(v.n)+'</option>';
      });
      if(groupsSeen.length) optsHTML+='</optgroup>';
      inner+='<div class="sent" data-sent="'+sent.key+'">'+
        '<div class="sent-head"><span class="sent-label">'+esc(sent.label)+'</span>'+
        '<select class="sent-sel" data-pick="'+sent.key+'">'+optsHTML+'</select></div>'+
        '<div class="en">'+htmlOf(segsEn)+'</div>'+
        (state.toggles.zh?'<div class="zh">'+htmlOf(segsZh)+'</div>':'')+
        (state.toggles.note&&varnt.note?'<div class="note"><b>注</b> '+esc(varnt.note)+'</div>':'')+
        '</div>';
    });
    if(p.fmtPos === "bottom") inner += fmtHTMLStr;
    totalWords+=pWords;
    html+='<div class="pblock">'+
      '<div class="phead"><span class="pnum">'+p.n+'</span><h2>'+p.title+'</h2>'+
      '<span class="tag">'+esc(p.tag)+'</span>'+
      '<div class="tools"><span class="tag">'+pWords+' words</span>'+
      '<button class="mini" data-copy-p="'+p.n+'">复制本段</button></div></div>'+
      inner+'</div>';
  });
  var target = state.type==="notice"||state.type==="minutes" ? "100 词左右" : "100 词左右";
  html+='<div class="stats"><span>全文 <b>'+totalWords+'</b> words</span><span>目标 '+target+'</span>'+
        '<span>题型 <b>'+TYPES.length+'</b></span><span>预设 <b>'+PRESETS.length+'</b></span>'+
        '<span>句子方案 <b>'+countVariants()+'</b></span>'+
        '<span>词库短语 <b>'+countOptions()+'</b></span></div>';
  box.innerHTML=html;

  Array.prototype.forEach.call(box.querySelectorAll("select[data-pick]"),function(sel){
    sel.onchange=function(){
      pushHistory();
      var raw=parseInt(sel.value,10);
      state.picks[sel.getAttribute("data-pick")]=(isNaN(raw)?0:raw);
      persist(); renderPreview();
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll("button[data-copy-p]"),function(b){
    b.onclick=function(){
      var n=b.getAttribute("data-copy-p");
      var p=paragraphsOf().filter(function(x){ return String(x.n)===n; })[0];
      copyText(paragraphText(p)); toast("已复制"+p.title);
    };
  });
}
function htmlOf(segs){
  var out="";
  segs.forEach(function(seg){
    if(seg.t==="text") out+=esc(seg.s);
    else out+='<button class="slot '+(seg.filled?"filled":"empty")+'" data-slot="'+seg.id+'">'+esc(seg.s)+'</button>';
  });
  return out;
}
function paragraphText(p){
  var parts=[];
  var ft = (p.fmt && p.fmt.length) ? fmtText(fmtSegments(p.fmt)) : "";
  if(ft && p.fmtPos !== "bottom") parts.push(ft);
  p.sents.forEach(function(s){
    var vv=variantOf(s);
    if(!vv) return;
    var cidx=connIndexFor(s.key);
    var tpl=(cidx?"{c"+cidx+"} ":"")+vv.en;
    parts.push(plainOf(segmentsOf(tpl,"en")));
  });
  if(ft && p.fmtPos === "bottom") parts.push(ft);
  return parts.join("\n");
}
function countVariants(){
  var seen={}, n=0;
  TYPES.forEach(function(t){ t.paras.forEach(function(p){ p.sents.forEach(function(s){ if(!seen[s.key]){ seen[s.key]=1; n+=s.vs.length; } }); }); });
  return n;
}
function countOptions(){
  var n=0; for(var k in BANK) n+=BANK[k].opts.length; return n;
}

/* ============ 弹窗 ============ */
function openSlot(id){
  modalSlot=id;
  document.getElementById("mTitle").textContent="【"+slotLabel(id)+"】";
  var hint=(BANK[id]&&BANK[id].hint)||"该槽位没有预置短语，直接输入即可";
  document.getElementById("mSub").textContent=hint;
  var body=document.getElementById("mBody");
  var cur=getSlot(id), opts=slotOpts(id), html="";
  if(!opts.length) html='<div class="empty-hint">没有内置选项，直接在下方输入框填写。</div>';
  opts.forEach(function(o,i){
    var cls=(cur&&cur.v===o.en)?"opt cur":"opt";
    html+='<button class="'+cls+'" data-opt="'+i+'"><div class="oe">'+esc(o.en||"（空）")+'</div>'+
          '<div class="oz">'+esc(o.zh||"")+'</div>'+
          (o.note?'<div class="onote">适用：'+esc(o.note)+'</div>':'')+'</button>';
  });
  body.innerHTML=html;
  var input=document.getElementById("mInput");
  input.value=cur?cur.v:"";
  document.getElementById("mNum").querySelectorAll("button").forEach(function(b){
    b.className=(cur&&cur.num===b.getAttribute("data-num"))?"on":(b.getAttribute("data-num")==="sg"&&(!cur||!cur.num)?"on":"");
  });
  Array.prototype.forEach.call(body.querySelectorAll("button[data-opt]"),function(b){
    b.onclick=function(){
      var o=opts[parseInt(b.getAttribute("data-opt"),10)];
      pushHistory(); setSlot(id,o.en,o.zh,o.num||""); persist(); renderPreview(); renderSidebar(); closeModal();
      flashSlot(id);
    };
  });
  document.getElementById("modal").classList.add("on");
  setTimeout(function(){ try{ input.focus(); }catch(e){} },80);
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); modalSlot=null; }
function flashSlot(id){
  var el=document.querySelector('.slot[data-slot="'+id+'"]');
  if(el){ el.classList.add("flash"); setTimeout(function(){ el.classList.remove("flash"); },700); }
}
function applyModalInput(){
  if(!modalSlot) return;
  var v=document.getElementById("mInput").value.trim();
  var nb=document.getElementById("mNum").querySelector("button.on");
  var num=nb?nb.getAttribute("data-num"):"";
  pushHistory();
  if(v) setSlot(modalSlot,v,"",num); else delete state.slots[modalSlot];
  persist(); renderPreview(); renderSidebar(); closeModal();
}

var toastTimer=null;
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove("on"); },1600);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

/* ============ 版本 ============ */
function compareVer(a,b){
  var x=a.split(".").map(Number), y=b.split(".").map(Number);
  for(var i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0); }
  return 0;
}
function repoInfo(){
  var h=location.hostname||"";
  if(!/github\.io$/.test(h)) return null;
  var owner=h.split(".")[0], parts=(location.pathname||"/").split("/").filter(Boolean);
  if(!parts.length) return null;
  return {owner:owner, repo:parts[0], path:parts.slice(1).join("/")||"index.html", branch:"main"};
}
function checkUpdate(silent){
  if(typeof fetch!=="function"){ if(!silent) toast("当前浏览器不支持自动检查更新"); return; }
  var info=repoInfo();
  if(!info){ if(!silent) toast("本地打开，跳过在线检查"); return; }
  var url="https://raw.githubusercontent.com/"+info.owner+"/"+info.repo+"/"+info.branch+"/"+info.path+"?t="+Date.now();
  fetch(url,{cache:"no-store"}).then(function(r){ return r.ok?r.text():""; }).then(function(txt){
    var m=txt.match(/APP_VERSION\s*=\s*'([0-9.]+)'/);
    if(m && compareVer(m[1],APP_VERSION)>0){
      document.getElementById("newVer").textContent="v"+m[1]+"（当前 v"+APP_VERSION+"）";
      document.getElementById("updateBar").classList.add("on");
    }else if(!silent) toast("已是最新版本 v"+APP_VERSION);
  }).catch(function(){ if(!silent) toast("检查更新失败（网络）"); });
}
function forceReload(){ location.replace(location.pathname+"?v="+Date.now()); }

/* ============ 初始化 ============ */
function renderAll(){
  renderChips(); renderPresets(); renderSidebar(); renderPreview();
  document.getElementById("verChip").textContent="v"+APP_VERSION;
  document.getElementById("footVer").textContent="v"+APP_VERSION;
}
function bindUI(){
  document.getElementById("tgZh").onchange=function(e){ state.toggles.zh=e.target.checked; persist(); renderPreview(); };
  document.getElementById("tgLite").onchange=function(e){ state.toggles.lite=e.target.checked; persist(); renderPreview(); };
  document.getElementById("tgNote").onchange=function(e){ state.toggles.note=e.target.checked; persist(); renderPreview(); };
  document.getElementById("tgGram").onchange=function(e){ state.toggles.gram=e.target.checked; persist(); renderPreview(); };
  Array.prototype.forEach.call(document.querySelectorAll("#sideSeg button"),function(b){
    b.onclick=function(){ document.getElementById("slotForm").setAttribute("data-tab",b.getAttribute("data-tab")); renderSidebar(); };
  });
  document.getElementById("btnUndo").onclick=function(){
    if(!undoStack.length){ toast("没有可撤销的操作"); return; }
    redoStack.push(JSON.stringify(state)); state=JSON.parse(undoStack.pop());
    persist(); renderAll(); toast("已撤销");
  };
  document.getElementById("btnRedo").onclick=function(){
    if(!redoStack.length){ toast("没有可重做的操作"); return; }
    undoStack.push(JSON.stringify(state)); state=JSON.parse(redoStack.pop());
    persist(); renderAll(); toast("已重做");
  };
  document.getElementById("btnSnap").onclick=function(){
    document.getElementById("snapPanel").classList.toggle("on"); renderSnapPanel();
  };
  document.getElementById("btnClear").onclick=function(){
    snapshot("清空前 · "+(TYPE_MAP[state.type]?TYPE_MAP[state.type].label:""));
    pushHistory(); state=emptyState(); persist(); renderAll(); toast("已清空，可撤销");
  };
  document.getElementById("btnCopyAll").onclick=function(){
    var txt=paragraphsOf().map(function(p){ return paragraphText(p); }).join("\n\n");
    copyText(txt); toast("全文 "+txt.split(/\s+/).filter(Boolean).length+" 词，已复制");
  };
  document.getElementById("btnCopyP1").onclick=function(){
    var p=paragraphsOf()[0]; copyText(paragraphText(p)); toast("已复制第一段");
  };
  document.getElementById("btnCopyP2").onclick=function(){
    var p=paragraphsOf()[1]; copyText(paragraphText(p)); toast("已复制第二段");
  };
  document.getElementById("mClose").onclick=closeModal;
  document.getElementById("mApply").onclick=applyModalInput;
  document.getElementById("mClear").onclick=function(){
    if(!modalSlot) return;
    pushHistory(); delete state.slots[modalSlot]; persist(); renderPreview(); renderSidebar(); closeModal();
  };
  document.getElementById("mInput").onkeydown=function(e){ if(e.key==="Enter") applyModalInput(); };
  document.getElementById("mNum").onclick=function(e){
    var b=e.target.closest?e.target.closest("button"):null;
    if(!b) return;
    this.querySelectorAll("button").forEach(function(x){ x.className=""; });
    b.className="on";
  };
  document.getElementById("modal").onclick=function(e){ if(e.target===this) closeModal(); };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });
  document.getElementById("preview").onclick=function(e){
    var b=e.target.closest?e.target.closest(".slot"):null;
    if(b) openSlot(b.getAttribute("data-slot"));
  };
  document.getElementById("btnForce").onclick=forceReload;
  document.getElementById("btnReload").onclick=forceReload;
}
function renderSnapPanel(){
  var panel=document.getElementById("snapPanel");
  if(!snapshots.length){ panel.innerHTML='<div class="empty-hint">还没有快照。<br>切换预设或清空时会自动存。</div>'; return; }
  var html='<div style="font-size:12px;color:var(--dim2);margin-bottom:6px">快照（最多 8 个，点击恢复）</div>';
  snapshots.forEach(function(s,i){
    var d=new Date(s.ts);
    var time=(d.getMonth()+1)+"月"+d.getDate()+"日 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    html+='<div class="snap"><div><b>'+esc(s.label)+'</b><br><span style="color:var(--dim2)">'+time+'</span></div>'+
          '<button class="mini" data-restore="'+i+'">恢复</button></div>';
  });
  panel.innerHTML=html;
  Array.prototype.forEach.call(panel.querySelectorAll("button[data-restore]"),function(b){
    b.onclick=function(){
      var idx=parseInt(b.getAttribute("data-restore"),10), s=snapshots[idx];
      if(!s) return;
      snapshot("恢复前 · 当前"); pushHistory();
      try{ state=JSON.parse(s.state); }catch(e){ return; }
      persist(); renderAll(); toast("已恢复快照");
    };
  });
}
function boot(){
  loadAll(); bindUI(); renderAll();
  setTimeout(function(){ checkUpdate(true); },1800);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible") checkUpdate(true);
  });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
</script>
